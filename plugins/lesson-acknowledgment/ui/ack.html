<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Policy Acknowledgment</title>
  <style>
    :root {
      --bg: var(--cio-background, #f8fafc);
      --card-bg: var(--cio-surface, #ffffff);
      --text: var(--cio-foreground, #0f172a);
      --text-muted: var(--cio-foreground-muted, #64748b);
      --border: var(--cio-border, #e2e8f0);
      --primary: var(--cio-accent, #2563eb);
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
      color: var(--text);
      padding: 12px;
    }

    .ack-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
    }

    .ack-header {
      font-size: 14px;
      font-weight: 600;
    }

    .ack-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.4;
      color: var(--text-muted);
    }

    .ack-label input {
      margin-top: 3px;
      cursor: pointer;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--success);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="ack-card">
    <div class="ack-header">Compliance & Acknowledgment</div>
    <label class="ack-label">
      <input type="checkbox" id="ack-checkbox">
      <span>I have read, reviewed, and agree to the compliance materials and guidelines presented in this lesson.</span>
    </label>
    <div id="ack-status" style="display: none;" class="status-badge">
      ✓ Acknowledged on <span id="ack-timestamp"></span>
    </div>
  </div>

  <script>
    const checkbox = document.getElementById('ack-checkbox');
    const statusDiv = document.getElementById('ack-status');
    const timestampSpan = document.getElementById('ack-timestamp');

    function applyTheme(theme) {
      if (!theme?.tokens) return;
      const root = document.documentElement;
      for (const [key, value] of Object.entries(theme.tokens)) {
        root.style.setProperty(`--cio-${key}`, value);
      }
    }

    let rpcPort = null;
    const pendingCallbacks = new Map();

    window.addEventListener('message', (event) => {
      if (event.data?.type === 'CIO_BRIDGE_HANDSHAKE_INIT') {
        rpcPort = event.ports[0];
        if (!rpcPort) return;

        rpcPort.onmessage = (e) => {
          if (e.data?.type === 'CIO_BRIDGE_CONTEXT_INIT') {
            if (e.data.theme) applyTheme(e.data.theme);
            const reqId = `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
            pendingCallbacks.set(reqId, (data) => {
              if (data && data.acknowledged) {
                checkbox.checked = true;
                checkbox.disabled = true;
                timestampSpan.textContent = new Date(data.timestamp).toLocaleDateString();
                statusDiv.style.display = 'inline-flex';
              }
            });
            rpcPort.postMessage({
              type: 'CIO_RPC_REQUEST',
              id: reqId,
              action: 'storage:get',
              payload: { namespace: 'acknowledgments', key: 'lesson_ack' }
            });
          } else if (e.data?.type === 'CIO_THEME_CHANGE') {
            if (e.data.theme) applyTheme(e.data.theme);
          } else if (e.data?.type === 'CIO_RPC_RESPONSE') {
            const cb = pendingCallbacks.get(e.data.id);
            if (cb) {
              pendingCallbacks.delete(e.data.id);
              if (e.data.success) cb(e.data.data);
            }
          }
        };

        rpcPort.postMessage({
          type: 'CIO_BRIDGE_HANDSHAKE_ACK',
          protocolVersion: '1.0',
          nonce: event.data.nonce,
          context: {}
        });
      }
    });

    checkbox.addEventListener('change', () => {
      if (!checkbox.checked || !rpcPort) return;

      const now = new Date().toISOString();
      rpcPort.postMessage({
        type: 'CIO_RPC_REQUEST',
        id: crypto.randomUUID(),
        action: 'storage:set',
        payload: {
          namespace: 'acknowledgments',
          key: 'lesson_ack',
          value: { acknowledged: true, timestamp: now }
        }
      });

      rpcPort.postMessage({
        type: 'CIO_RPC_REQUEST',
        id: crypto.randomUUID(),
        action: 'toast',
        payload: { message: 'Acknowledgment recorded', variant: 'success' }
      });

      checkbox.disabled = true;
      timestampSpan.textContent = new Date(now).toLocaleDateString();
      statusDiv.style.display = 'inline-flex';
    });
  </script>
</body>
</html>
