<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcement Banner</title>
  <style>
    :root {
      --banner-bg: #eff6ff;
      --banner-text: #1e40af;
      --banner-border: #bfdbfe;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --banner-bg: #1e3a8a33;
        --banner-text: #93c5fd;
        --banner-border: #1e40af;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: transparent;
      color: var(--banner-text);
      padding: 6px 12px;
    }

    .banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: var(--banner-bg);
      border: 1px solid var(--banner-border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
    }

    .banner.warning {
      --banner-bg: #fffbeb;
      --banner-text: #92400e;
      --banner-border: #fde68a;
    }

    .banner.critical {
      --banner-bg: #fef2f2;
      --banner-text: #991b1b;
      --banner-border: #fecaca;
    }

    .close-btn {
      background: transparent;
      border: 0;
      cursor: pointer;
      color: inherit;
      opacity: 0.7;
      font-size: 16px;
      line-height: 1;
    }

    .close-btn:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="banner-root" class="banner" style="display: none;">
    <span id="banner-text"></span>
    <button id="close-btn" class="close-btn" aria-label="Dismiss">&times;</button>
  </div>

  <script>
    const bannerRoot = document.getElementById('banner-root');
    const bannerText = document.getElementById('banner-text');
    const closeBtn = document.getElementById('close-btn');

    closeBtn.addEventListener('click', () => {
      bannerRoot.style.display = 'none';
      sessionStorage.setItem('cio_banner_dismissed', 'true');
    });

    function applyTheme(theme) {
      if (!theme?.tokens) return;
      const root = document.documentElement;
      for (const [key, value] of Object.entries(theme.tokens)) {
        root.style.setProperty(`--cio-${key}`, value);
      }
    }

    let rpcPort = null;
    const pendingCallbacks = new Map();

    window.addEventListener('message', (event) => {
      if (event.data?.type === 'CIO_BRIDGE_HANDSHAKE_INIT') {
        rpcPort = event.ports[0];
        if (!rpcPort) return;

        rpcPort.onmessage = (e) => {
          if (e.data?.type === 'CIO_BRIDGE_CONTEXT_INIT') {
            if (e.data.theme) applyTheme(e.data.theme);
            if (sessionStorage.getItem('cio_banner_dismissed') === 'true') return;
            const reqId = `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
            pendingCallbacks.set(reqId, (data) => {
              if (data && data.enabled && data.text) {
                bannerText.textContent = data.text;
                if (data.level) bannerRoot.className = 'banner ' + data.level;
                bannerRoot.style.display = 'flex';
              }
            });
            rpcPort.postMessage({
              type: 'CIO_RPC_REQUEST',
              id: reqId,
              action: 'storage:get',
              payload: { namespace: 'settings', key: 'banner' }
            });
          } else if (e.data?.type === 'CIO_THEME_CHANGE') {
            if (e.data.theme) applyTheme(e.data.theme);
          } else if (e.data?.type === 'CIO_RPC_RESPONSE') {
            const cb = pendingCallbacks.get(e.data.id);
            if (cb) {
              pendingCallbacks.delete(e.data.id);
              if (e.data.success) cb(e.data.data);
            }
          }
        };

        rpcPort.postMessage({
          type: 'CIO_BRIDGE_HANDSHAKE_ACK',
          protocolVersion: '1.0',
          nonce: event.data.nonce,
          context: {}
        });
      }
    });
  </script>
</body>
</html>
