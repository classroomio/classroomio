<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Core concepts</title>
  </head>
  <body>
    <h1>Core concepts</h1>
    <p>Ungraded module with suspend data so resume can be observed.</p>
    <button id="save" type="button">Save bookmark and suspend</button>
    <button id="complete" type="button">Mark core complete</button>
    <div id="log" aria-live="polite"></div>
    <script>
      function findApi(win) {
        while (win) {
          if (win.API_1484_11 && win.API_1484_11.Initialize) return win.API_1484_11;
          if (win.parent === win) return null;
          win = win.parent;
        }
        return null;
      }
      var api = findApi(window);
      var logEl = document.getElementById('log');
      if (api) api.Initialize('');
      document.getElementById('save').onclick = function () {
        api.SetValue('cmi.location', 'concept-2');
        api.SetValue('cmi.suspend_data', 'concept=2');
        api.SetValue('cmi.exit', 'suspend');
        api.Commit('');
        logEl.textContent = 'saved with exit=suspend';
      };
      document.getElementById('complete').onclick = function () {
        api.SetValue('cmi.completion_status', 'completed');
        api.SetValue('cmi.exit', 'normal');
        api.Commit('');
        api.Terminate('');
        logEl.textContent = 'completed, terminated with exit=normal';
      };
    </script>
  </body>
</html>
