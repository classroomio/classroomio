<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>SCORM 2004 timer 2min</title>
<style>body{font-family:sans-serif;margin:1.5rem;line-height:1.5}#timer{font-size:2.5rem;font-weight:800;font-family:monospace}#log{white-space:pre-wrap;border:1px solid #999;padding:.5rem;min-height:6rem}button{margin:.2rem}</style></head>
<body><h1>SCORM 2004 timer 2min</h1><p>2004 counterpart to scorm-timer-test: PT2M0S, timeLimitAction exit,message, success/completion split.</p><div id="timer">--:--</div><div><button id="b-init">Init</button><button id="b-start">Start 120s timer</button><button id="b-10s">10s fast test</button><button id="b-submit">Submit pass</button><button id="b-fail">Submit fail</button></div><div id="log"></div>
<script>
function findApi(w){var n=0;while(w&&n<10){if(w.API_1484_11)return w.API_1484_11;if(w.API&&w.API.LMSInitialize)return w.API;if(w.parent===w)return null;w=w.parent;n++}return null}
var api=null,logEl=document.getElementById('log'),remain=120,tid=null,start=Date.now(),is2004=false;
function log(m){logEl.textContent+=m+'\n'}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function fmtT(ms){var t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;if(is2004){return 'PT'+(h?h+'H':'')+(m?m+'M':'')+s+'S'}return String(h).padStart(4,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.00'}
function G(k){return is2004?api.GetValue(k):api.LMSGetValue(k)}function S(k,v){return is2004?api.SetValue(k,String(v)):api.LMSSetValue(k,String(v))}function C(){return is2004?api.Commit(''):api.LMSCommit('')}function F(){return is2004?api.Terminate(''):api.LMSFinish('')}
function tick(){var el=document.getElementById('timer');if(remain<=0){clearInterval(tid);if(api){var e=fmtT(Date.now()-start);S(is2004?'cmi.session_time':'cmi.core.session_time',e);S(is2004?'cmi.exit':'cmi.core.exit','time-out');S(is2004?'cmi.completion_status':'cmi.core.lesson_status','incomplete');C();F();log('TIMEOUT '+e)}return}remain--;el.textContent=fmt(remain)}
document.getElementById('b-init').onclick=function(){api=findApi(window);if(!api){log('no API');return}is2004=!!api.Initialize;log('Init->'+(is2004?api.Initialize(''):api.LMSInitialize(''))+' 2004='+is2004);S(is2004?'cmi.completion_status':'cmi.core.lesson_status','incomplete');C()};
document.getElementById('b-start').onclick=function(){remain=120;clearInterval(tid);tid=setInterval(tick,1000);log('timer 120s started')};
document.getElementById('b-10s').onclick=function(){remain=10;clearInterval(tid);tid=setInterval(tick,1000);log('fast 10s')};
function sub(pass){if(!api){log('init first');return}var e=fmtT(Date.now()-start);if(is2004){S('cmi.score.scaled',pass?'0.9':'0.4');S('cmi.score.raw',pass?'90':'40');S('cmi.session_time',e);S('cmi.success_status',pass?'passed':'failed');S('cmi.completion_status','completed');S('cmi.exit','normal')}else{S('cmi.core.score.raw',pass?'90':'40');S('cmi.core.session_time',e);S('cmi.core.lesson_status',pass?'passed':'failed');S('cmi.core.exit','')}C();F();log('submitted '+(pass?'passed':'failed')+' '+e);clearInterval(tid)}
document.getElementById('b-submit').onclick=function(){sub(true)};document.getElementById('b-fail').onclick=function(){sub(false)};
</script></body></html>
