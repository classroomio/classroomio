<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Motion graphics</title>
<link rel="stylesheet" href="lib/styles.css">
</head>
<body>
<div id="stage"></div>
<script src="project.js"></script>
<script src="img/manifest.js"></script>
<script src="lib/engine.js"></script>
<script src="lib/cinema.js"></script>
<!-- One script per scene file, in timeline order. -->
<script src="scenes/example.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  if (params.has('bg')) document.body.classList.add('preview-bg');
  if (params.has('t')) document.fonts.ready.then(() => window.assetsReady).then(() => window.prepareAt(parseFloat(params.get('t')))).then(() => window.renderAt(parseFloat(params.get('t'))));
</script>
</body>
</html>
