<!-- @dsCard group="Components" viewport="700x380" name="Inputs & fields" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--ui-background);font-family:var(--font-sans);color:var(--ui-foreground)}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--ink-500);letter-spacing:.08em;width:78px;flex-shrink:0}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.ClassroomIODesignSystem || window[Object.keys(window).find(k => { try { return window[k] && window[k].NotchCard && window[k].Select; } catch (e) { return false; } })] || {};
const Row = ({ l, children, top }) => <div style={{ display: 'flex', alignItems: top ? 'flex-start' : 'center', gap: 12, marginBottom: 14, flexWrap: 'wrap' }}><span className="lbl">{l}</span>{children}</div>;
const { Input, Textarea, Field, InputGroup, PasswordInput, Kbd } = NS;
const search = <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
ReactDOM.createRoot(document.getElementById('root')).render(<div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
<Field label="Course title" htmlFor="t" required description="Shown to learners on the catalogue."><Input id="t" placeholder="Admin essentials"/></Field>
<Field label="Email" error="Enter a valid email address."><Input invalid defaultValue="ada@"/></Field>
<Field label="Search"><InputGroup start={search} end={<Kbd>⌘K</Kbd>} placeholder="Search courses"/></Field>
<Field label="Academy URL"><InputGroup start="https://" end=".classroomio.com" placeholder="northwind"/></Field>
<Field label="Password"><PasswordInput showStrength defaultValue="Northw1nd"/></Field>
<Field label="Description"><Textarea placeholder="What will learners get out of this?"/></Field>
<Field label="Disabled"><Input disabled placeholder="Read only"/></Field>
</div>);
</script></body></html>
