<!-- @dsCard group="Spacing" viewport="700x160" name="Borders & elevation" subtitle="Hairlines, not shadows; ink sketch outlines" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--page);padding:20px;font-family:var(--font-sans);color:var(--ink-900)}.m{font-family:var(--font-mono);font-size:11px;color:var(--ink-500)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:64px;border-radius:10px;border:1px solid var(--sand-300)}</style></head><body><div class="row" style="gap:16px"><div style="display:flex;flex-direction:column;gap:6px"><div style="width:110px;height:72px;background:var(--paper);border:1px solid var(--sand-300);box-shadow:none;border-radius:10px"></div><span class="m">hairline sand</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:110px;height:72px;background:var(--paper);border:1px solid rgba(23,20,15,0.10);box-shadow:none;border-radius:10px"></div><span class="m">hairline ink 10%</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:110px;height:72px;background:var(--paper);border:1.6px solid var(--ink-900);box-shadow:none;border-radius:10px"></div><span class="m">sketch 1.6 ink</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:110px;height:72px;background:var(--paper);border:1.4px dashed var(--blue-700);box-shadow:none;border-radius:10px"></div><span class="m">dashed slot</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:110px;height:72px;background:var(--paper);border:1px solid rgba(23,20,15,0.08);box-shadow:0 1px 2px rgba(23,20,15,0.05);border-radius:10px"></div><span class="m">subtle shadow</span></div></div></body></html>
