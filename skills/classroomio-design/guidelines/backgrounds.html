<!-- @dsCard group="Brand" viewport="700x220" name="Backgrounds" subtitle="Gradient wash, dot field, sand band, CTA glow" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--page);padding:20px;margin:0;font-family:var(--font-sans)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;height:176px}.c{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--sand-300)}.m{position:absolute;bottom:8px;left:10px;font-family:var(--font-mono);font-size:10px;color:var(--ink-500)}</style></head><body><div class="g">
<div class="c cio-wash" style="border-radius:18px 18px 0 0"><div class="cio-dotfield" style="position:absolute;inset:0"></div><span class="m">hero wash + dot field</span></div>
<div class="c" style="background:#F6F2E9"><div style="position:absolute;left:14px;right:14px;top:22px;height:80px;background:#fff;border-radius:10px"><span style="position:absolute;top:-1px;left:16px;width:34px;height:7px;background:#F6F2E9;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,6px 100%)"></span></div><span class="m">sand band · white notch cards</span></div>
<div class="c cio-dotgrid" style="background-color:#FDFBF7"><span class="m">dot grid (product mocks)</span></div>
<div class="c" style="background:var(--cta-gradient)"><span class="m" style="color:var(--blue-200)">CTA glow + iso grid</span></div>
</div></body></html>
