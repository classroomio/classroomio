<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Certificate editor · ClassroomIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="app-theme.css" />
    <link rel="stylesheet" href="verify.css?v=6" />
    <script>
      if (localStorage.cioTheme === 'dark' || (!localStorage.cioTheme && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    </script>
    <style>
      html, body { height: 100%; }
      body { margin: 0; display: flex; flex-direction: column; overflow: hidden; }
      svg.i { width: 16px; height: 16px; stroke-width: 2; flex: none; }
      .p-top { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; background: var(--background); border-bottom: 1px solid var(--border); }
      .p-top .l { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .p-top h1 { margin: 0; font-size: 16px; font-weight: 400; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .p-top .r { display: flex; align-items: center; gap: 6px; }
      .p-tag { display: inline-flex; align-items: center; gap: 4px; }
      .p-tag .badge { font-size: 10px; text-transform: uppercase; }
      .p-body { flex: 1; min-height: 0; display: flex; }
      .p-rail { width: 56px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0; background: var(--secondary); border-right: 1px solid var(--border); }
      .p-rail button { position: relative; width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--foreground); cursor: pointer; }
      .p-rail button:hover { background: var(--muted); }
      .p-rail button.on { background: var(--primary); color: var(--primary-foreground); }
      .p-rail button .new { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 2px var(--secondary); }
      .p-rail button.on .new { background: #fff; box-shadow: 0 0 0 2px var(--primary); }
      .p-rail button[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 46px; top: 50%; transform: translateY(-50%); background: var(--foreground); color: var(--background); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; z-index: 10; pointer-events: none; }
      .p-rail .sp { flex: 1; }
      .p-panel { width: min(100%, 380px); flex: none; display: flex; flex-direction: column; background: var(--card); border-right: 1px solid var(--border); }
      .p-ph { padding: 16px 20px; border-bottom: 1px solid var(--border); }
      .p-ph h2 { margin: 0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      .p-ph p { margin: 4px 0 0; font-size: 12px; color: var(--muted-foreground); line-height: 1.5; }
      .p-pb { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 28px; }
      .p-set { margin-bottom: 4px; }
      .p-set > .lg { font-size: 14px; font-weight: 600; margin: 0 0 12px; }
      .p-sep { height: 1px; background: var(--border); margin: 18px 0; }
      .p-pb .field { margin-bottom: 12px; }
      .p-hint { font-size: 12px; color: var(--muted-foreground); line-height: 1.5; margin: 6px 0 0; }
      .p-sw { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; margin-bottom: 12px; }
      .p-stage { flex: 1; min-width: 0; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 56px; background-color: var(--muted); background-image: radial-gradient(color-mix(in oklab, var(--foreground) 16%, transparent) 1px, transparent 1px); background-size: 18px 18px; }
      .p-paper { width: 100%; max-width: 900px; position: relative; }
      .p-paper .cq { box-shadow: 0 10px 30px -8px rgb(0 0 0 / 0.25), 0 2px 6px rgb(0 0 0 / 0.08); }
      .p-paper .cq-verify { outline: 2px solid transparent; outline-offset: 5px; border-radius: 6px; transition: outline-color 0.15s; }
      .p-paper.hl .cq-verify { outline-color: #2563eb; }
      .p-stage { position: relative; }
      .p-states { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 4px; padding: 4px; background: var(--background); border: 1px solid var(--border); border-radius: 999px; box-shadow: var(--shadow-md); z-index: 5; white-space: nowrap; }
      .p-states .lbl { font-size: 12px; color: var(--muted-foreground); padding: 0 8px 0 10px; }
      .p-states button { border: 0; background: none; font: inherit; font-size: 12.5px; padding: 5px 12px; border-radius: 999px; cursor: pointer; color: var(--muted-foreground); }
      .p-states button.on { background: var(--foreground); color: var(--background); }
      .p-states .pub { color: var(--primary); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
      .p-stamp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-12deg); border: 5px solid var(--destructive); color: var(--destructive); font-weight: 800; letter-spacing: 0.14em; font-size: clamp(22px, 3.4vw, 44px); padding: 6px 28px; border-radius: 12px; background: rgb(255 255 255 / 0.7); text-transform: uppercase; pointer-events: none; display: none; }
      .p-paper.st-revoked .cq { filter: grayscale(1); opacity: 0.55; }
      .p-paper.st-expired .cq { opacity: 0.8; }
      .p-paper.st-revoked .p-stamp, .p-paper.st-expired .p-stamp { display: block; }
      .p-paper.st-expired .p-stamp { border-color: var(--warning); color: var(--warning); }
      .p-hintpill { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--background); border: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); box-shadow: var(--shadow-md); pointer-events: none; z-index: 2; }
      .p-paper [data-edit] { cursor: pointer; border-radius: 4px; outline: 2px solid transparent; outline-offset: 3px; transition: outline-color 0.12s, background-color 0.12s; }
      .p-paper [data-edit]:hover { outline-color: #2563eb; background-color: rgb(37 99 235 / 0.07); }
      .p-paper [data-edit].cur { outline-color: #2563eb; }
      .p-paper [data-edit="fixed"] { cursor: default; }
      .p-paper [data-edit="fixed"]:hover { outline-color: rgb(120 120 120 / 0.55); outline-style: dashed; background-color: transparent; }
      .p-paper .cq-fields.hl { outline: 2px solid #2563eb; outline-offset: 5px; border-radius: 6px; }
      .p-tpl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .p-tpl button { position: relative; aspect-ratio: 1.4 / 1; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; padding: 0; background: #fff; transition: transform 0.15s, box-shadow 0.15s; }
      .p-tpl button:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
      .p-tpl button.on { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); transform: translateY(-2px); }
      .p-tpl button i { position: absolute; inset: 0; }
      .p-tpl button i::before { content: ''; position: absolute; inset: 14% 12% 34%; border: 2px solid rgb(0 0 0 / 0.18); border-radius: 2px; }
      .p-tpl button span { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; text-align: center; font-size: 9px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; background: var(--foreground); color: var(--background); }
      .p-tpl button.on span { background: var(--primary); color: var(--primary-foreground); }
      .p-sw6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
      .p-sw6 button { aspect-ratio: 1; border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; transition: transform 0.15s; }
      .p-sw6 button:hover { transform: translateY(-2px); }
      .p-sw6 button.on { box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--foreground); }
      .p-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; margin-bottom: 12px; }
      .p-card .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 12px; font-weight: 600; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.05em; }
      .p-note { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--muted-foreground); background: var(--muted); border-radius: var(--radius-md); padding: 12px; line-height: 1.5; margin-bottom: 14px; }
      .p-url { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 4px 4px 4px 10px; background: var(--muted); font-size: 12.5px; }
      .p-url span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .p-up { display: flex; align-items: center; justify-content: center; height: 56px; width: 120px; border: 1px dashed var(--border); border-radius: var(--radius-md); font-size: 12px; color: var(--muted-foreground); cursor: pointer; background: var(--background); }
      .p-dl { display: flex; flex-direction: column; gap: 8px; }
      @media (max-width: 1000px) {
        body { overflow: auto; } .p-body { flex-direction: column; } .p-rail { width: auto; flex-direction: row; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--border); }
        .p-panel { width: 100%; border-right: 0; border-bottom: 1px solid var(--border); } .p-pb { max-height: 420px; } .p-stage { padding: 20px 14px; }
        .p-rail .sp { display: none; } .p-rail button[data-tip]:hover::after { display: none; }
      }
    </style>
  </head>
  <body>
    <header class="p-top">
      <div class="l">
        <a class="btn btn-ghost btn-icon btn-sm" href="course-certificate-settings.html" aria-label="Back to certificates" style="width:32px;height:32px"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
        <h1>Food Safety Level 2</h1>
        <span class="p-tag"><span class="badge badge-secondary" id="tplBadge">Classique</span><span class="badge badge-outline" id="dirtyBadge" hidden style="font-size:10px">Unsaved</span></span>
      </div>
      <div class="r">
        <button class="btn btn-ghost btn-sm" id="discard" hidden>Discard</button>
        <button class="btn btn-outline btn-sm" id="save" disabled>Save changes</button>
        <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </div>
    </header>
    <div class="p-body">
      <nav class="p-rail" id="rail" aria-label="Editor sections"></nav>
      <aside class="p-panel"><div class="p-ph" id="ph"></div><div class="p-pb" id="pb"></div></aside>
      <section class="p-stage" aria-label="Live preview"><div class="p-hintpill">Click anything on the certificate to edit it</div><div class="p-paper" id="paper"><div id="cert"></div><div class="p-stamp" id="pStamp">Valid</div></div><div class="p-states" id="pStates" role="group" aria-label="Preview the certificate as"><span class="lbl">Preview as</span><button type="button" class="on" data-st="valid">Valid</button><button type="button" data-st="expired">Expired</button><button type="button" data-st="revoked">Revoked</button><button type="button" class="pub" id="pPublic">Preview <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></button></div></section>
    </div>
    <div class="toast" id="toast"></div>
    <script src="common.js"></script>
    <script src="states-preview.js?v=4"></script>
    <script>
      (function () {
        var state = "valid", paper = document.getElementById("paper"), stamp = document.getElementById("pStamp");
        document.getElementById("pStates").addEventListener("click", function (e) {
          var b = e.target.closest("[data-st]");
          if (!b) return;
          state = b.getAttribute("data-st");
          paper.classList.toggle("st-expired", state === "expired");
          paper.classList.toggle("st-revoked", state === "revoked");
          stamp.textContent = state === "expired" ? "Expired" : "Revoked";
          document.querySelectorAll("#pStates [data-st]").forEach(function (x) { x.classList.toggle("on", x === b); });
        });
        document.getElementById("pPublic").onclick = function () { window.openStatesPreview(state); };
      })();
    </script>
    <script>
      var $ = function (id) { return document.getElementById(id); };
      var MAX = 5;
      var TEMPLATES = [['classique', '#fbf5ec'], ['brutalist', '#f2f2f2'], ['noir', '#1a1a1a'], ['poster', '#ffe9b8'], ['minimal', '#ffffff']];
      var ACCENTS = ['#7a1f1f', '#1d4ed8', '#0f766e', '#b45309', '#6d28d9', '#111827'];
      var ICONS = {
        templates: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></svg>',
        content: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>',
        colors: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 2a10 10 0 0 0 0 20 2 2 0 0 0 2-2c0-.6-.2-1-.5-1.4-.3-.4-.5-.8-.5-1.3a2 2 0 0 1 2-2H17a5 5 0 0 0 5-5c0-4.4-4.5-8-10-8z"/></svg>',
        details: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
        verify: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>',
        download: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>',
        lock: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
        copy: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
        plus: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>',
        trash: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
        info: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
      };
      var PANELS = [
        ['templates', 'Templates', 'Pick a template to anchor the visual style.'],
        ['content', 'Content', 'Fine-tune the words that appear on the certificate.'],
        ['colors', 'Accent color', 'Used for the recipient line, accents, and stamp.'],
        ['export', 'Export', 'Preview the current design as it will be delivered.']
      ];
      var NEW = {};
      var D = {
        template: 'classique', accent: '#7a1f1f', subtitle: 'Awarded with highest distinction',
        desc: 'Learn how to handle, store and prepare food safely, and how to spot and control hazards in a working kitchen.',
        sigs: [{ name: 'Course Facilitator', role: 'Facilitator', on: true }, { name: 'Organization Lead', role: 'Director', on: true }],
        idFormat: 'N° {seq}', expOn: true, months: 24,
        fields: []
      };
      var snap = JSON.stringify(D);
      var active = 'templates';

      function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      function isDirty() { return JSON.stringify(D) !== snap; }
      function field(label, inner, hint) { return '<div class="field"><label class="label">' + label + '</label>' + inner + (hint ? '<p class="p-hint">' + hint + '</p>' : '') + '</div>'; }
      function input(path, value, o) { o = o || {}; return '<input class="input' + (o.mono ? ' mono' : '') + '" data-m="' + path + '" value="' + esc(value) + '"' + (o.max ? ' maxlength="' + o.max + '"' : '') + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + ' />'; }
      function sw(path, on, text) { return '<label class="p-sw"><span class="switch"><input type="checkbox" data-m="' + path + '"' + (on ? ' checked' : '') + ' /><span class="track"></span><span class="knob"></span></span><span>' + text + '</span></label>'; }
      function set(title, body) { return '<div class="p-set">' + (title ? '<div class="lg">' + title + '</div>' : '') + body + '</div>'; }
      var SEP = '<div class="p-sep"></div>';

      function certOpts() {
        return {
          org: 'Acme Academy', title: 'Food Safety Level 2', subtitle: D.subtitle, name: 'Ada Okafor', desc: D.desc || 'The course description appears here.', accent: D.accent,
          sig1: D.sigs[0], sig2: D.sigs[1], year: '2026', idText: D.idFormat.replace('{seq}', '0247'), code: '7KQM-4XH2', revoked: false,
          fields: []
        };
      }
      function paint() {
        var root = $('cert');
        root.innerHTML = window.certHtml(certOpts());
        window.drawAllQr(root);
        tagEditable(root);
      }
      function tag(el, key, tip) { if (!el) return; el.setAttribute('data-edit', key); el.title = tip; }
      function tagEditable(root) {
        tag(root.querySelector('.cq-sub'), 'subtitle', 'Edit subtitle');
        tag(root.querySelector('.cq-desc'), 'desc', 'Edit description');
        tag(root.querySelector('.cq-seal'), 'idFormat', 'Edit certificate ID format');
        tag(root.querySelector('.cq-verify'), 'fixed', 'Added automatically. Manage the public page in Certificate settings');
        tag(root.querySelector('.cq-org'), 'fixed', 'Comes from your organization settings');
        tag(root.querySelector('.cq-title'), 'fixed', 'Comes from the course title');
        tag(root.querySelector('.cq-name'), 'fixed', 'Filled in with each learner\'s name');
        root.querySelectorAll('.cq-sig').forEach(function (el, i) { tag(el, 'sig:' + i, 'Edit signatory ' + (i + 1)); });
      }
      var FIXED_MSG = { 'cq-org': 'The organization name comes from your organization settings', 'cq-title': 'The title comes from the course', 'cq-name': 'The name is filled in for each learner' };
      function focusInput(sel) {
        var el = $('pb').querySelector(sel);
        if (el) { el.focus(); if (el.select) el.select(); }
      }
      $('cert').addEventListener('click', function (e) {
        var t = e.target.closest('[data-edit]');
        if (!t) { active = 'colors'; renderAll(); return; }
        var k = t.getAttribute('data-edit');
        if (k === 'fixed') {
          var c = t.className.split(' ')[0];
          window.showToast(FIXED_MSG[c] || 'This part is filled in automatically');
          return;
        }
        var sel;
        if (k.indexOf('sig:') === 0) { active = 'content'; sel = '[data-m="sig:' + k.split(':')[1] + ':name"]'; }
        else { active = 'content'; sel = '[data-m="' + k + '"]'; }
        renderAll();
        if (sel) focusInput(sel);
        var cur = $('cert').querySelector('[data-edit="' + k + '"]');
        if (cur) cur.classList.add('cur');
      });

      function panelBody() {
        if (active === 'templates') {
          return '<div class="p-tpl">' + TEMPLATES.map(function (t) { return '<button type="button" class="' + (D.template === t[0] ? 'on' : '') + '" data-act="tpl" data-v="' + t[0] + '"><i style="background:' + t[1] + '"></i><span>' + t[0] + '</span></button>'; }).join('') + '</div><p class="p-hint" style="margin-top:16px">Templates render with the same renderer used for the downloaded PDF and PNG. The prototype draws Classique.</p>';
        }
        if (active === 'content') {
          var sigs = D.sigs.map(function (g, i) {
            return set('', sw('sig:' + i + ':on', g.on, 'Show signatory ' + (i + 1)) + (g.on ? field('Signatory ' + (i + 1) + ' name', input('sig:' + i + ':name', g.name, { max: 40 })) + field('Signatory ' + (i + 1) + ' role', input('sig:' + i + ':role', g.role, { max: 30 })) + '<div class="field"><label class="label">Signature image</label><div class="p-up">Upload</div><p class="p-hint">Upload a signature image (optional)</p></div>' : ''));
          }).join(SEP);
          return set('Header copy', field('Subtitle', input('subtitle', D.subtitle, { max: 60, ph: 'Awarded with Highest Distinction' })) + field('Description override', '<textarea class="textarea" data-m="desc" rows="4" maxlength="240" placeholder="Defaults to the course description.">' + esc(D.desc) + '</textarea>', 'Leave blank to fall back to the course description on save.')) +
            SEP + set('Signatories', sigs) + SEP + set('Reference', field('Certificate ID format', input('idFormat', D.idFormat, { mono: true, max: 40, ph: 'N° {seq}' }), 'Use {seq} for the last four digits, {year} for the issue year, {month} for the month. Separate from the verification code.'));
        }
        if (active === 'colors') {
          return '<div class="p-sw6">' + ACCENTS.map(function (c) { return '<button type="button" class="' + (c === D.accent ? 'on' : '') + '" style="background:' + c + '" data-act="accent" data-v="' + c + '" aria-label="' + c + '"></button>'; }).join('') + '</div><p class="p-hint" style="margin-top:12px">Accent color appears on the recipient rule, stamps, and the template\'s headline highlight.</p>';
        }
        return '<div class="p-dl"><button class="btn btn-outline btn-sm" type="button">Download PDF</button><button class="btn btn-outline btn-sm" type="button">Download PNG</button><button class="btn btn-outline btn-sm" type="button">Print</button></div><p class="p-hint" style="margin-top:12px">Exports use a sample name as the recipient so you can preview the final layout.</p>';
      }

      function renderRail() {
        $('rail').innerHTML = PANELS.filter(function (p) { return p[0] !== 'export'; }).map(function (p) {
          return '<button type="button" class="' + (active === p[0] ? 'on' : '') + '" data-panel="' + p[0] + '" data-tip="' + p[1] + '" aria-label="' + p[1] + '"' + (active === p[0] ? ' aria-current="page"' : '') + '>' + ICONS[p[0]] + (NEW[p[0]] && active !== p[0] ? '<span class="new"></span>' : '') + '</button>';
        }).join('') + '<button type="button" class="' + (active === 'export' ? 'on' : '') + '" data-panel="export" data-tip="Export" aria-label="Export">' + ICONS.download + '</button>';
      }
      function renderPanel() {
        var p = PANELS.filter(function (x) { return x[0] === active; })[0];
        $('ph').innerHTML = '<h2>' + p[1] + (NEW[active] ? '<span class="badge badge-primary-soft">New</span>' : '') + '</h2><p>' + p[2] + '</p>';
        $('pb').innerHTML = panelBody();
      }
      function renderBar() {
        var d = isDirty();
        $('save').disabled = !d; $('discard').hidden = !d; $('dirtyBadge').hidden = !d;
        $('tplBadge').textContent = D.template;
      }
      function renderAll() { renderRail(); renderPanel(); paint(); renderBar(); }

      function setPath(p, v) {
        var a = p.split(':');
        if (a[0] === 'sig') D.sigs[+a[1]][a[2]] = v;
        else if (p === 'months') D.months = Math.max(1, Math.min(120, parseInt(v, 10) || 1));
        else D[p] = v;
      }

      $('rail').addEventListener('click', function (e) { var b = e.target.closest('[data-panel]'); if (b) { active = b.getAttribute('data-panel'); renderAll(); } });
      var pb = $('pb');
      pb.addEventListener('input', function (e) {
        var p = e.target.getAttribute('data-m');
        if (!p || e.target.type === 'checkbox' || e.target.tagName === 'SELECT' || p === 'months') return;
        setPath(p, e.target.value); paint(); renderBar();
      });
      pb.addEventListener('change', function (e) {
        var p = e.target.getAttribute('data-m');
        if (!p) return;
        if (e.target.type === 'checkbox') setPath(p, e.target.checked);
        else if (e.target.tagName === 'SELECT') setPath(p, e.target.value);
        else if (p === 'months') setPath(p, e.target.value);
        else return;
        renderAll();
      });
      pb.addEventListener('click', function (e) {
        var a = e.target.closest('[data-act]');
        if (!a) return;
        var act = a.getAttribute('data-act'); var v = a.getAttribute('data-v');
        if (act === 'tpl') D.template = v;
        if (act === 'accent') D.accent = v;
        renderAll();
      });
      $('save').onclick = function () {
        snap = JSON.stringify(D); renderAll(); window.showToast('Certificate design saved');
      };
      $('discard').onclick = function () { D = JSON.parse(snap); renderAll(); };
      window.addEventListener('beforeunload', function (e) { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });

      var qp = new URLSearchParams(location.search).get('panel');
      if (qp && PANELS.some(function (x) { return x[0] === qp; })) active = qp;
      renderAll();
    </script>
  </body>
</html>
