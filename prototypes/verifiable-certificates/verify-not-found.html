<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Certificate not found · Acme Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="landing-theme.css" />
    <link rel="stylesheet" href="verify.css?v=6" />
    <link rel="stylesheet" href="org-shell.css" />
    <script>
      if (localStorage.cioTheme === 'dark' || (!localStorage.cioTheme && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <div id="os-top"></div>

    <main class="vp-main">
      <div class="vp-col">
        <div class="vp-card">
          <div class="vp-status vp-neutral">
            <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div>
            <div><h1>We couldn't find that certificate</h1><p>Check the code printed on the certificate and try again.</p></div>
          </div>
          <div class="vp-lookup-card">
            <form class="vp-lookup" onsubmit="event.preventDefault(); location.href = 'verify-lookup.html?code=' + encodeURIComponent(this.code.value)">
              <input name="code" value="ZZZZ-ZZZZ" autocomplete="off" aria-label="Certificate code" />
              <button class="lp-btn lp-btn-primary" type="submit">Verify</button>
            </form>
            <p class="vp-help" style="margin-bottom: 0">Codes have 8 characters and are not case-sensitive. They never contain the letters I, L, O or the digits 0, 1.</p>
          </div>
        </div>
      </div>
    </main>
    <div id="os-foot"></div>
    <button id="theme" class="lp-theme-btn" aria-label="Toggle theme" style="position: fixed; right: 16px; bottom: 16px"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <div class="toast" id="toast"></div>
    <script src="common.js"></script>
    <script src="org-shell.js"></script>
  </body>
</html>
