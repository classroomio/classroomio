<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Search — UX variants</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="app-theme.css" />
    <link rel="stylesheet" href="search-proto.css" />
    <script>
      if (
        localStorage.cioTheme === 'dark' ||
        (!localStorage.cioTheme && matchMedia('(prefers-color-scheme: dark)').matches)
      )
        document.documentElement.classList.add('dark');
    </script>
    <style>
      .proto-picker {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2147483647;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 999px;
        background: rgba(10, 10, 10, 0.82);
        -webkit-backdrop-filter: blur(12px) saturate(1.4);
        backdrop-filter: blur(12px) saturate(1.4);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08) inset,
          0 8px 24px rgba(0, 0, 0, 0.24),
          0 2px 6px rgba(0, 0, 0, 0.12);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        line-height: 1;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }
      .proto-picker-highlight {
        position: absolute;
        top: 4px;
        left: 0;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        will-change: transform;
      }
      .proto-picker[data-ready] .proto-picker-highlight {
        transition:
          transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
          width 250ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        .proto-picker[data-ready] .proto-picker-highlight {
          transition: none;
        }
      }
      .proto-picker-item {
        position: relative;
        display: flex;
        align-items: center;
        height: 28px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.55);
        font: inherit;
        cursor: pointer;
        transition: color 150ms ease-out;
      }
      .proto-picker-item:hover {
        color: rgba(255, 255, 255, 0.85);
      }
      .proto-picker-item:active {
        transform: scale(0.97);
      }
      .proto-picker-item:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.4);
        outline-offset: 2px;
      }
      .proto-picker-item[data-active] {
        color: #fff;
      }
      .proto-picker-divider {
        width: 1px;
        height: 16px;
        margin: 0 4px;
        background: rgba(255, 255, 255, 0.12);
      }
      .proto-picker-replay {
        padding: 0 10px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>

    <nav class="proto-picker" aria-label="Prototype variants">
      <span class="proto-picker-highlight" aria-hidden="true"></span>
      <button class="proto-picker-item" data-active aria-current="true">Palette</button>
      <button class="proto-picker-item">Moments</button>
      <button class="proto-picker-item">Preview</button>
      <span class="proto-picker-divider" aria-hidden="true"></span>
      <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
    </nav>

    <script>
      const ICO = {
        search:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>',
        book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
        lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
        play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>',
        sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
      };

      function mark(text, q) {
        if (!q) return text;
        const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return text.replace(new RegExp(escaped, 'ig'), (m) => `<mark>${m}</mark>`);
      }

      function playerMarkup(opts) {
        const { title, sub, time, duration, jumped, youtube } = opts;
        return `
          <div class="player ${jumped ? 'jumped' : ''}" data-player>
            <div class="frame"></div>
            ${youtube ? '<span class="yt-tag">YouTube</span>' : ''}
            <span class="jump-chip" data-jump-chip>Jumped to ${time}</span>
            <div class="center-title">
              <div>
                <h2>${title}</h2>
                <p>${sub}</p>
              </div>
            </div>
            <div class="play-ui">
              <div class="time-row"><span data-now>${jumped ? time : '0:00'}</span><span>${duration}</span></div>
              <div class="bar"><i data-bar style="width:${jumped ? '34%' : '0%'}"></i></div>
            </div>
          </div>`;
      }

      function transcriptPanel(activeStart) {
        const segs = [
          { t: '7:48', s: 468, text: 'So when the component unmounts, we still have that subscription hanging around.' },
          { t: '8:12', s: 492, text: 'The useEffect cleanup function is where you unsubscribe, clear timers, and cancel in-flight work.' },
          { t: '8:41', s: 521, text: 'If you skip it, you get the classic "setState on unmounted component" warning.' }
        ];
        return `
          <aside class="transcript">
            <h3>Transcript</h3>
            <p class="text-muted" style="font-size:12px;margin:0 0 10px">Click a line to seek · YouTube captions</p>
            ${segs
              .map(
                (seg) => `
              <button class="seg ${seg.s === activeStart ? 'active' : ''}" type="button" data-seek="${seg.s}" data-label="${seg.t}">
                <div class="t">${seg.t}</div>
                <div class="s">${seg.s === activeStart ? mark(seg.text, 'useEffect cleanup') : seg.text}</div>
              </button>`
              )
              .join('')}
          </aside>`;
      }

      function lmsSidebar(active) {
        return `
          <aside class="sidebar">
            <div class="brand"><div class="brand-mark">U</div><div class="brand-name">Udemy Test</div></div>
            <div class="nav-label">Learn</div>
            <a class="nav-item ${active === 'home' ? 'active' : ''}" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
            <a class="nav-item ${active === 'courses' ? 'active' : ''}" href="#">${ICO.book} Courses</a>
            <a class="nav-item" href="#">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/></svg>
              Explore
            </a>
            <div class="sidebar-foot" style="margin-top:auto;padding:12px 8px;display:flex;gap:10px;align-items:center">
              <div class="avatar" style="width:28px;height:28px;border-radius:99px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700">AO</div>
              <div><div style="font-size:13px;font-weight:500">Ada Okafor</div><div class="text-muted" style="font-size:11px">Learner</div></div>
            </div>
          </aside>`;
      }

      function paletteHits(q) {
        const show = q.trim().length >= 3;
        if (!show) {
          return `<div class="empty-row">Try <button type="button" class="chip" data-fill-query>useEffect cleanup</button></div>`;
        }
        return `
          <div class="group-label">In videos</div>
          <button class="hit" type="button" data-open-moment="effects" aria-selected="true">
            <span class="ico yt">8:12</span>
            <span class="mainline">
              <span class="title">“…the ${mark('useEffect cleanup', q)} function is where you unsubscribe…”</span>
              <span class="snippet">Spoken in the YouTube lesson, not the written notes.</span>
              <span class="meta"><span class="badge yt">YouTube</span><span>Modern Web Development · Lesson 4 · Effects</span></span>
            </span>
          </button>
          <button class="hit" type="button" data-open-moment="stale">
            <span class="ico">2:04</span>
            <span class="mainline">
              <span class="title">“Cleanup also avoids stale closures in ${mark('useEffect', q)}.”</span>
              <span class="meta"><span class="badge">Uploaded</span><span>Modern Web Development · Lesson 6</span></span>
            </span>
          </button>
          <div class="group-label">Lessons</div>
          <button class="hit" type="button" data-open-moment="effects">
            <span class="ico">${ICO.book}</span>
            <span class="mainline">
              <span class="title">Effects and subscriptions</span>
              <span class="snippet">${mark('Cleanup', q)} belongs in the function returned from ${mark('useEffect', q)}.</span>
            </span>
          </button>
          <div class="group-label">In the catalog · not enrolled</div>
          <button class="hit" type="button" data-open-locked>
            <span class="ico lock">${ICO.lock}</span>
            <span class="mainline">
              <span class="title">Advanced React Patterns</span>
              <span class="snippet">Enroll to search inside this course. Transcripts stay hidden until you have access.</span>
              <span class="meta"><span class="badge lock">Paid · $49</span><span>No snippet shown on purpose</span></span>
            </span>
          </button>`;
      }

      function variantPalette() {
        return `
          <div data-flow="palette">
            <div class="hint">
              <strong>Palette</strong>
              <span class="muted">In-app · extends ⌘K. Search enrolled content, including YouTube captions. Paid courses appear as lock teasers with no transcript quote.</span>
            </div>
            <div class="app" data-screen="home">
              ${lmsSidebar('home')}
              <div class="main">
                <header class="topbar">
                  <span class="top-title">Dashboard</span>
                  <button class="search-pill" type="button" data-open-search data-testid="search-trigger">
                    ${ICO.search}
                    Search your courses
                    <span class="kbds"><span>⌘</span><span>K</span></span>
                  </button>
                  <div class="top-actions">
                    <button class="icon-btn" type="button" data-theme title="Toggle theme">${ICO.sun}</button>
                  </div>
                </header>
                <main class="content">
                  <div class="wrap">
                    <p class="text-muted" style="margin:0 0 6px">Monday, September 16</p>
                    <h1 style="font-size:26px;letter-spacing:-0.02em;margin:0 0 8px;font-weight:600">Good afternoon, Ada.</h1>
                    <p class="text-muted" style="margin:0 0 20px">Pick up Effects and subscriptions — or search for a sentence you remember from the video.</p>
                    <div class="home-cards">
                      <div class="card home-card">
                        <div class="cover" style="background:linear-gradient(135deg,#312e81,#6366f1)"></div>
                        <div class="b"><div class="t">Modern Web Development with React</div><div class="d">Enrolled · 12 lessons · includes YouTube</div></div>
                      </div>
                      <div class="card home-card">
                        <div class="cover" style="background:linear-gradient(135deg,#134e4a,#34d399)"></div>
                        <div class="b"><div class="t">Getting started with MVC</div><div class="d">Enrolled · public course also on the academy</div></div>
                      </div>
                    </div>
                  </div>
                </main>
              </div>
            </div>
            <div class="overlay" hidden data-palette>
              <div class="palette" role="dialog" aria-label="Search">
                <div class="palette-input">
                  ${ICO.search}
                  <input data-q placeholder="Search lessons, videos, exercises…" aria-label="Search query" />
                </div>
                <div class="palette-body" data-hits></div>
              </div>
            </div>
            <div class="app" hidden data-screen="lesson">
              ${lmsSidebar('courses')}
              <div class="main">
                <header class="topbar">
                  <div class="crumbs">
                    <a href="#" data-back>Courses</a>
                    <span class="sep">/</span>
                    <span>Modern Web Development</span>
                    <span class="sep">/</span>
                    <span class="here">Effects and subscriptions</span>
                  </div>
                  <button class="search-pill" type="button" data-open-search>
                    ${ICO.search} Search
                    <span class="kbds"><span>⌘</span><span>K</span></span>
                  </button>
                </header>
                <div class="lesson-layout">
                  <div class="player-col">
                    <p class="text-muted" style="margin:0 0 8px;font-size:12.5px">Lesson 4 of 12 · YouTube embed</p>
                    <h1 style="margin:0 0 14px;font-size:22px;letter-spacing:-0.02em">Effects and subscriptions</h1>
                    <div data-player-slot></div>
                    <p style="margin:16px 0 0;color:var(--muted-foreground);font-size:13.5px;max-width:62ch">
                      Notes stay in the lesson body. The spoken explanation lives in the YouTube captions — that is why search can send you to 8:12 instead of the top of the video.
                    </p>
                  </div>
                  <div data-transcript-slot></div>
                </div>
              </div>
            </div>
            <div class="sheet" hidden data-enroll>
              <div class="sheet-card">
                <h2>Enroll to search inside</h2>
                <p>Advanced React Patterns is a paid course. Search will not quote its videos or notes until Ada is enrolled — the snippet would be the content.</p>
                <div style="display:flex;gap:8px;justify-content:flex-end">
                  <button class="btn btn-outline" type="button" data-close-enroll>Not now</button>
                  <button class="btn btn-primary" type="button" data-close-enroll>View course · $49</button>
                </div>
              </div>
            </div>
          </div>`;
      }

      function variantMoments() {
        return `
          <div data-flow="moments">
            <div class="hint">
              <strong>Moments</strong>
              <span class="muted">Public academy. Visitors search unlocked public videos and land at the timestamp. Paid courses are cards without quotes.</span>
            </div>
            <div class="pub" data-screen="home">
              <header class="pub-nav">
                <div class="brand-mark">U</div>
                <div class="brand-name">Udemy Test</div>
                <form class="pub-search" data-search-form>
                  ${ICO.search}
                  <input name="q" placeholder="Search the academy…" aria-label="Academy search" data-q />
                </form>
                <button class="btn btn-outline" type="button">Log in</button>
                <button class="icon-btn" type="button" data-theme title="Toggle theme">${ICO.sun}</button>
              </header>
              <div class="pub-hero">
                <h1>Learn in public.</h1>
                <p>Search titles, lesson notes, and captions from unlocked public courses. Paid catalogs stay teasers.</p>
                <button class="chip" type="button" data-fill-query>Try: useEffect cleanup</button>
              </div>
              <div class="moment-list" style="padding-top:8px">
                <button class="moment-card" type="button" disabled style="opacity:.7;cursor:default">
                  <div class="thumb" style="background:linear-gradient(135deg,#1e1b4b,#6366f1)"></div>
                  <div>
                    <div class="badge">Public course</div>
                    <div class="t" style="font-weight:600;margin-top:6px">Getting started with MVC</div>
                    <div class="text-muted" style="font-size:13px;margin-top:4px">Open to anyone · captions indexed</div>
                  </div>
                </button>
              </div>
            </div>
            <div class="pub" hidden data-screen="results">
              <header class="pub-nav">
                <div class="brand-mark">U</div>
                <div class="brand-name">Udemy Test</div>
                <form class="pub-search" data-search-form>
                  ${ICO.search}
                  <input name="q" data-q-results placeholder="Search the academy…" />
                </form>
                <button class="btn btn-outline" type="button">Log in</button>
              </header>
              <div class="pub-hero" style="padding-bottom:0">
                <p class="text-muted" style="margin:0 0 6px;font-size:12.5px">Search</p>
                <h1 style="font-size:24px" data-results-title>useEffect cleanup</h1>
                <div class="chips" data-chips>
                  <button class="chip" type="button" data-chip="all" aria-pressed="true">All</button>
                  <button class="chip" type="button" data-chip="videos" aria-pressed="false">Videos</button>
                  <button class="chip" type="button" data-chip="lessons" aria-pressed="false">Lessons</button>
                  <button class="chip" type="button" data-chip="courses" aria-pressed="false">Courses</button>
                </div>
              </div>
              <div class="moment-list" data-results></div>
            </div>
            <div class="pub" hidden data-screen="lesson">
              <header class="pub-nav">
                <div class="brand-mark">U</div>
                <div class="brand-name">Udemy Test</div>
                <button class="btn btn-outline" type="button" data-back>Back to results</button>
              </header>
              <div class="lesson-layout" style="max-width:1200px;margin:0 auto">
                <div class="player-col">
                  <p class="text-muted" style="margin:0 0 8px;font-size:12.5px">Public course · no account required</p>
                  <h1 style="margin:0 0 14px;font-size:22px">Controllers, views, and cleanup</h1>
                  <div data-player-slot></div>
                </div>
                <div data-transcript-slot></div>
              </div>
            </div>
            <div class="sheet" hidden data-enroll>
              <div class="sheet-card">
                <h2>This course is paid</h2>
                <p>You can see that Advanced React Patterns exists. You cannot read its captions from search. Enroll to watch — then the same query will jump to the moment.</p>
                <div style="display:flex;gap:8px;justify-content:flex-end">
                  <button class="btn btn-outline" type="button" data-close-enroll>Keep browsing</button>
                  <button class="btn btn-primary" type="button" data-close-enroll>Enroll · $49</button>
                </div>
              </div>
            </div>
          </div>`;
      }

      function resultsCards(chip) {
        const video = `
          <button class="moment-card" type="button" data-kind="videos" data-open-public>
            <div class="thumb" style="background:linear-gradient(135deg,#0f172a,#334155)">
              <span class="ts">3:41</span>
            </div>
            <div>
              <span class="badge yt">YouTube · Public</span>
              <div class="quote">“…always return a ${mark('useEffect cleanup', 'cleanup')} so the controller does not keep listening after the view is gone.”</div>
              <div class="text-muted" style="font-size:12.5px">Getting started with MVC · Controllers, views, and cleanup</div>
            </div>
          </button>`;
        const lesson = `
          <button class="moment-card" type="button" data-kind="lessons" data-open-public>
            <div class="thumb" style="background:linear-gradient(135deg,#1e1b4b,#6366f1)"></div>
            <div>
              <span class="badge">Lesson notes</span>
              <div class="quote">Written note: pair every subscription with a ${mark('cleanup', 'cleanup')} in the controller lifecycle.</div>
              <div class="text-muted" style="font-size:12.5px">Getting started with MVC</div>
            </div>
          </button>`;
        const locked = `
          <button class="moment-card locked" type="button" data-kind="courses" data-open-locked>
            <div class="thumb" style="background:linear-gradient(135deg,#3f1d0f,#b45309)">
              <span class="ts">${ICO.lock}</span>
            </div>
            <div>
              <span class="badge lock">Paid · $49 · not in this academy search</span>
              <div class="quote">Advanced React Patterns — enroll to search inside. No caption quote is shown.</div>
              <div class="text-muted" style="font-size:12.5px">Catalog teaser · same title search the public /courses page already allows</div>
            </div>
          </button>`;
        if (chip === 'videos') return video;
        if (chip === 'lessons') return lesson;
        if (chip === 'courses') return locked;
        return video + lesson + locked;
      }

      function variantPreview() {
        return `
          <div data-flow="preview">
            <div class="hint">
              <strong>Preview</strong>
              <span class="muted">In-course split pane. Select a caption hit and the player seeks before you leave the page. Locked courses stay teasers.</span>
            </div>
            <div class="app course-app" data-screen="home">
              ${lmsSidebar('courses')}
              <aside class="course-rail">
                <div class="nav-label">Modern Web Development</div>
                <div class="item">1. Welcome</div>
                <div class="item">2. JSX and components</div>
                <div class="item">3. State</div>
                <div class="item active">4. Effects and subscriptions</div>
                <div class="item">5. Exercise: effects</div>
              </aside>
              <div class="main">
                <header class="topbar">
                  <span class="top-title">Effects and subscriptions</span>
                  <button class="search-pill" type="button" data-open-search data-testid="course-search">
                    ${ICO.search}
                    Search this course
                  </button>
                  <div class="top-actions">
                    <button class="icon-btn" type="button" data-theme>${ICO.sun}</button>
                  </div>
                </header>
                <div class="player-col">
                  ${playerMarkup({
                    title: 'Effects and subscriptions',
                    sub: 'YouTube · playing from the start until you search',
                    time: '0:00',
                    duration: '14:08',
                    jumped: false,
                    youtube: true
                  })}
                  <p class="text-muted" style="margin-top:16px;max-width:62ch">
                    Ada is already in the lesson. She remembers a sentence from later in the video — search should preview that second here, then she can open it.
                  </p>
                </div>
              </div>
            </div>
            <div class="preview-overlay" hidden data-preview>
              <div class="preview-shell" role="dialog" aria-label="Search this course">
                <div class="preview-list">
                  <div class="palette-input">
                    ${ICO.search}
                    <input data-q placeholder="Search this course…" value="useEffect cleanup" />
                  </div>
                  <div class="preview-hits">
                    <div class="group-label">Moments in this course</div>
                    <button class="hit" type="button" data-preview-hit="492" data-label="8:12" aria-selected="true">
                      <span class="ico yt">8:12</span>
                      <span class="mainline">
                        <span class="title">The ${mark('useEffect cleanup', 'useEffect cleanup')} function is where you unsubscribe…</span>
                        <span class="meta"><span class="badge yt">YouTube</span><span>Lesson 4</span></span>
                      </span>
                    </button>
                    <button class="hit" type="button" data-preview-hit="124" data-label="2:04">
                      <span class="ico">2:04</span>
                      <span class="mainline">
                        <span class="title">Cleanup also avoids stale closures.</span>
                        <span class="meta"><span class="badge">Uploaded</span><span>Lesson 6</span></span>
                      </span>
                    </button>
                    <div class="group-label">Other courses</div>
                    <button class="hit" type="button" data-open-locked>
                      <span class="ico lock">${ICO.lock}</span>
                      <span class="mainline">
                        <span class="title">Advanced React Patterns</span>
                        <span class="snippet">Not enrolled · no caption preview</span>
                      </span>
                    </button>
                  </div>
                </div>
                <div class="preview-player">
                  <div data-live-player>
                    ${playerMarkup({
                      title: 'Effects and subscriptions',
                      sub: 'Preview · YouTube',
                      time: '8:12',
                      duration: '14:08',
                      jumped: true,
                      youtube: true
                    })}
                  </div>
                  <div class="preview-foot">
                    <div class="cap">Previewing <strong>8:12</strong> — “The useEffect cleanup function is where you unsubscribe…”</div>
                    <button class="btn btn-primary" type="button" data-commit style="margin-left:auto">Open at 8:12</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="app" hidden data-screen="lesson">
              ${lmsSidebar('courses')}
              <div class="main">
                <header class="topbar">
                  <div class="crumbs"><span class="here">Effects and subscriptions</span></div>
                </header>
                <div class="lesson-layout">
                  <div class="player-col">
                    <h1 style="margin:0 0 14px;font-size:22px">Effects and subscriptions</h1>
                    <div data-player-slot></div>
                  </div>
                  <div data-transcript-slot></div>
                </div>
              </div>
            </div>
            <div class="sheet" hidden data-enroll>
              <div class="sheet-card">
                <h2>Stay in this course</h2>
                <p>Preview will not load a paid course Ada does not own. The list can point at it; the player cannot.</p>
                <div style="display:flex;justify-content:flex-end">
                  <button class="btn btn-primary" type="button" data-close-enroll>Got it</button>
                </div>
              </div>
            </div>
          </div>`;
      }

      function wireTheme(root) {
        root.querySelectorAll('[data-theme]').forEach((btn) => {
          btn.addEventListener('click', () => document.documentElement.classList.toggle('dark'));
        });
      }

      function showScreen(root, name) {
        root.querySelectorAll('[data-screen]').forEach((el) => {
          el.hidden = el.getAttribute('data-screen') !== name;
        });
      }

      function mountLesson(root, label) {
        const slot = root.querySelector('[data-player-slot]');
        const trans = root.querySelector('[data-transcript-slot]');
        if (slot) {
          slot.innerHTML = playerMarkup({
            title: 'Effects and subscriptions',
            sub: 'Deep link ?t=492 · YouTube',
            time: label || '8:12',
            duration: '14:08',
            jumped: true,
            youtube: true
          });
        }
        if (trans) trans.innerHTML = transcriptPanel(492);
        trans?.querySelectorAll('[data-seek]').forEach((btn) => {
          btn.addEventListener('click', () => {
            trans.querySelectorAll('.seg').forEach((s) => s.classList.remove('active'));
            btn.classList.add('active');
            const now = root.querySelector('[data-now]');
            const bar = root.querySelector('[data-bar]');
            const chip = root.querySelector('[data-jump-chip]');
            if (now) now.textContent = btn.dataset.label;
            if (bar) bar.style.width = btn.dataset.seek === '492' ? '34%' : '20%';
            if (chip) chip.textContent = 'Jumped to ' + btn.dataset.label;
          });
        });
      }

      function initPalette(root) {
        const overlay = root.querySelector('[data-palette]');
        const input = root.querySelector('[data-q]');
        const hits = root.querySelector('[data-hits]');
        const enroll = root.querySelector('[data-enroll]');

        const renderHits = () => {
          hits.innerHTML = paletteHits(input.value);
          hits.querySelector('[data-fill-query]')?.addEventListener('click', () => {
            input.value = 'useEffect cleanup';
            renderHits();
            input.focus();
          });
          hits.querySelectorAll('[data-open-moment]').forEach((btn) => {
            btn.addEventListener('click', () => {
              overlay.hidden = true;
              showScreen(root, 'lesson');
              mountLesson(root, '8:12');
            });
          });
          hits.querySelector('[data-open-locked]')?.addEventListener('click', () => {
            enroll.hidden = false;
          });
        };

        const open = () => {
          overlay.hidden = false;
          renderHits();
          requestAnimationFrame(() => input.focus());
        };

        root.querySelectorAll('[data-open-search]').forEach((el) => el.addEventListener('click', open));
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) overlay.hidden = true;
        });
        input.addEventListener('input', renderHits);
        root.querySelector('[data-back]')?.addEventListener('click', (e) => {
          e.preventDefault();
          showScreen(root, 'home');
        });
        root.querySelectorAll('[data-close-enroll]').forEach((b) =>
          b.addEventListener('click', () => {
            enroll.hidden = true;
          })
        );
        renderHits();
        wireTheme(root);
      }

      function initMoments(root) {
        const enroll = root.querySelector('[data-enroll]');
        const resultsBox = root.querySelector('[data-results]');
        const qHome = root.querySelector('[data-q]');
        const qResults = root.querySelector('[data-q-results]');

        const goResults = (q) => {
          const query = (q || 'useEffect cleanup').trim();
          showScreen(root, 'results');
          if (qResults) qResults.value = query;
          root.querySelector('[data-results-title]').textContent = query;
          resultsBox.innerHTML = resultsCards('all');
          bindResults();
        };

        function bindResults() {
          resultsBox.querySelectorAll('[data-open-public]').forEach((btn) => {
            btn.addEventListener('click', () => {
              showScreen(root, 'lesson');
              mountLesson(root, '3:41');
              const now = root.querySelector('[data-now]');
              if (now) now.textContent = '3:41';
            });
          });
          resultsBox.querySelectorAll('[data-open-locked]').forEach((btn) => {
            btn.addEventListener('click', () => {
              enroll.hidden = false;
            });
          });
        }

        root.querySelectorAll('[data-search-form]').forEach((form) => {
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = form.querySelector('input').value;
            goResults(val);
          });
        });
        root.querySelector('[data-fill-query]')?.addEventListener('click', () => {
          if (qHome) qHome.value = 'useEffect cleanup';
          goResults('useEffect cleanup');
        });
        root.querySelectorAll('[data-chip]').forEach((chip) => {
          chip.addEventListener('click', () => {
            root.querySelectorAll('[data-chip]').forEach((c) => c.setAttribute('aria-pressed', 'false'));
            chip.setAttribute('aria-pressed', 'true');
            resultsBox.innerHTML = resultsCards(chip.dataset.chip);
            bindResults();
          });
        });
        root.querySelector('[data-back]')?.addEventListener('click', () => showScreen(root, 'results'));
        root.querySelectorAll('[data-close-enroll]').forEach((b) =>
          b.addEventListener('click', () => {
            enroll.hidden = true;
          })
        );
        wireTheme(root);
      }

      function initPreview(root) {
        const overlay = root.querySelector('[data-preview]');
        const enroll = root.querySelector('[data-enroll]');
        const live = root.querySelector('[data-live-player]');
        const cap = root.querySelector('.preview-foot .cap');
        const commit = root.querySelector('[data-commit]');

        root.querySelector('[data-open-search]')?.addEventListener('click', () => {
          overlay.hidden = false;
        });
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) overlay.hidden = true;
        });

        root.querySelectorAll('[data-preview-hit]').forEach((btn) => {
          btn.addEventListener('click', () => {
            root.querySelectorAll('[data-preview-hit]').forEach((b) => b.setAttribute('aria-selected', 'false'));
            btn.setAttribute('aria-selected', 'true');
            const label = btn.dataset.label;
            live.innerHTML = playerMarkup({
              title: 'Effects and subscriptions',
              sub: 'Preview · YouTube',
              time: label,
              duration: '14:08',
              jumped: true,
              youtube: true
            });
            cap.innerHTML = `Previewing <strong>${label}</strong> — “The useEffect cleanup function is where you unsubscribe…”`;
            commit.textContent = 'Open at ' + label;
            commit.dataset.label = label;
          });
        });

        commit.addEventListener('click', () => {
          overlay.hidden = true;
          showScreen(root, 'lesson');
          mountLesson(root, commit.dataset.label || '8:12');
        });

        root.querySelector('[data-open-locked]')?.addEventListener('click', () => {
          enroll.hidden = false;
        });
        root.querySelector('[data-close-enroll]')?.addEventListener('click', () => {
          enroll.hidden = true;
        });
        wireTheme(root);
      }

      const variants = [variantPalette, variantMoments, variantPreview];
      const inits = [initPalette, initMoments, initPreview];

      const stage = document.getElementById('stage');
      const picker = document.querySelector('.proto-picker');
      const highlight = picker.querySelector('.proto-picker-highlight');
      const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
      const replay = picker.querySelector('.proto-picker-replay');
      let current = 0;

      function moveHighlight() {
        const el = items[current];
        highlight.style.width = el.offsetWidth + 'px';
        highlight.style.transform = `translateX(${el.offsetLeft}px)`;
      }

      function mount(i) {
        stage.innerHTML = '';
        requestAnimationFrame(() => {
          stage.innerHTML = variants[i]();
          inits[i](stage.firstElementChild);
        });
      }

      function setActive(i) {
        if (i < 0 || i >= variants.length) return;
        current = i;
        items.forEach((el, j) => {
          el.toggleAttribute('data-active', j === i);
          if (j === i) el.setAttribute('aria-current', 'true');
          else el.removeAttribute('aria-current');
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set('v', i + 1);
        history.replaceState(null, '', url);
        mount(i);
      }

      items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
      replay?.addEventListener('click', () => mount(current));
      window.addEventListener('resize', moveHighlight);

      document.addEventListener('keydown', (e) => {
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= variants.length) setActive(num - 1);
        else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
        else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
        else if (e.key === 'r' || e.key === 'R') mount(current);
      });

      setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
      requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
    </script>
  </body>
</html>
