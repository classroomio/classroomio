<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add question — Interactive Video Checkpoints</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="app-theme.css" />
    <link rel="stylesheet" href="checkpoints.css" />
    <script>
      if (localStorage.cioTheme === 'dark' || (!localStorage.cioTheme && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <div class="course-app">
      <aside class="course-side">
        <a class="back-link" href="teacher-video-tab.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 18l-6-6 6-6"/></svg> Video tab</a>
        <div class="section-label">Module 1</div>
        <a class="tree-item active" href="teacher-video-tab.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="14" rx="2"/></svg> Why hand hygiene matters <span class="qcount">4</span></a>
      </aside>
      <div class="course-main">
        <header class="course-header"><h1>Why hand hygiene matters</h1></header>
        <div class="course-body"><div class="course-col">
          <div class="player" style="filter: blur(2px);">
            <div class="player-stage"><div class="play-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div></div>
          </div>
        </div></div>
      </div>
    </div>

    <div class="dialog-scrim" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <form class="dialog" action="teacher-video-tab.html">
        <h2 id="dlg-title">Add a question</h2>
        <p class="hint">Any auto-gradable type. The video pauses here; after they answer, it continues from this time. Paragraph, file, and recording questions stay on the exam.</p>

        <div class="field">
          <label for="ts">Time in video</label>
          <input id="ts" type="text" value="0:45" />
        </div>

        <div class="field">
          <label id="type-label">Question type</label>
          <div class="type-grid" role="group" aria-labelledby="type-label">
            <button class="type-chip" type="button" data-type="RADIO" aria-pressed="true">Single answer</button>
            <button class="type-chip" type="button" data-type="CHECKBOX" aria-pressed="false">Multiple answers</button>
            <button class="type-chip" type="button" data-type="TRUE_FALSE" aria-pressed="false">True / false</button>
            <button class="type-chip" type="button" data-type="NUMERIC" aria-pressed="false">Numeric</button>
            <button class="type-chip" type="button" data-type="FILL_BLANK" aria-pressed="false">Fill in the blank</button>
            <button class="type-chip" type="button" data-type="WORD_BANK" aria-pressed="false">Word bank</button>
            <button class="type-chip" type="button" data-type="ORDERING" aria-pressed="false">Ordering <span class="pro">Pro</span></button>
            <button class="type-chip" type="button" data-type="STAR" aria-pressed="false">Star rating <span class="pro">Pro</span></button>
          </div>
        </div>

        <div class="field">
          <label for="prompt">Question</label>
          <textarea id="prompt" rows="2">When must you wash your hands?</textarea>
        </div>

        <div class="field" id="type-body"></div>

        <div class="field">
          <label>When they answer</label>
          <label class="option" style="margin:0 0 8px;"><input type="radio" name="resume" value="any" checked /><span class="option-label"><b>Continue after they answer</b><br /><span class="text-muted">Playback resumes as soon as they submit a complete answer. Recommended for short teaching videos.</span></span></label>
          <label class="option" style="margin:0;"><input type="radio" name="resume" value="correct" /><span class="option-label"><b>Require the correct answer</b><br /><span class="text-muted">Wrong answers stay on this screen with Try again. The video does not move on until they get it fully right.</span></span></label>
        </div>

        <div class="dialog-foot">
          <a class="btn btn-secondary" href="teacher-video-tab.html">Cancel</a>
          <a class="btn btn-primary" href="teacher-video-tab.html">Save question</a>
        </div>
      </form>
    </div>

    <button class="icon-btn theme-fab" id="theme" title="Toggle theme" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
    </button>
    <script>
      document.getElementById('theme').onclick = () => {
        const dark = document.documentElement.classList.toggle('dark');
        localStorage.cioTheme = dark ? 'dark' : 'light';
      };

      const prompts = {
        RADIO: 'When must you wash your hands?',
        CHECKBOX: 'Which moments always require hand hygiene? Select all that apply.',
        TRUE_FALSE: 'Alcohol rub replaces soap and water when hands are visibly soiled.',
        NUMERIC: 'How many moments of hand hygiene does WHO define?',
        FILL_BLANK: 'Wash your hands ___ touching a patient and ___ a clean procedure.',
        WORD_BANK: 'Use ___ and water when hands are ___ soiled.',
        ORDERING: 'Put the WHO 5 moments in order.',
        STAR: 'How many stars should a complete 5-moment sequence score?'
      };

      const bodies = {
        RADIO:
          '<label>Answers — mark the correct one</label>' +
          '<div class="opt-edit"><input type="radio" name="correct" checked /><input type="text" value="Before and after every patient contact" /><button class="btn btn-ghost btn-sm" type="button">Remove</button></div>' +
          '<div class="opt-edit"><input type="radio" name="correct" /><input type="text" value="Only at the start of a shift" /><button class="btn btn-ghost btn-sm" type="button">Remove</button></div>' +
          '<div class="opt-edit"><input type="radio" name="correct" /><input type="text" value="Only when hands look dirty" /><button class="btn btn-ghost btn-sm" type="button">Remove</button></div>' +
          '<button class="btn btn-secondary btn-sm" type="button">Add option</button>',
        CHECKBOX:
          '<label>Answers — mark every correct option</label>' +
          '<div class="opt-edit"><input type="checkbox" checked /><input type="text" value="Before touching a patient" /><button class="btn btn-ghost btn-sm" type="button">Remove</button></div>' +
          '<div class="opt-edit"><input type="checkbox" checked /><input type="text" value="Before a clean or aseptic procedure" /><button class="btn btn-ghost btn-sm" type="button">Remove</button></div>' +
          '<div class="opt-edit"><input type="checkbox" /><input type="text" value="Only at the end of a shift" /><button class="btn btn-ghost btn-sm" type="button">Remove</button></div>' +
          '<button class="btn btn-secondary btn-sm" type="button">Add option</button>',
        TRUE_FALSE:
          '<label>Answers — mark the correct one</label>' +
          '<div class="opt-edit"><input type="radio" name="correct" /><input type="text" value="True" /><span></span></div>' +
          '<div class="opt-edit"><input type="radio" name="correct" checked /><input type="text" value="False" /><span></span></div>',
        NUMERIC:
          '<label for="correct-num">Correct value</label>' +
          '<input id="correct-num" type="text" value="5" />' +
          '<label for="tol" style="margin-top:10px">Tolerance</label>' +
          '<input id="tol" type="text" value="0" />',
        FILL_BLANK:
          '<p class="text-muted" style="margin:0 0 8px;font-size:13px">Use three or more underscores for each blank. Production uses the existing fill-in-the-blank editor.</p>' +
          '<label>Accepted answers for blank 1</label>' +
          '<input type="text" value="before" />' +
          '<label style="margin-top:10px">Accepted answers for blank 2</label>' +
          '<input type="text" value="before" />',
        WORD_BANK:
          '<label>Template — blanks are ___ </label>' +
          '<input type="text" value="Use ___ and water when hands are ___ soiled." />' +
          '<label style="margin-top:10px">Word bank (correct answers plus distractors)</label>' +
          '<div class="bank"><span>soap</span><span>visibly</span><span>alcohol</span><span>rarely</span></div>',
        ORDERING:
          '<label>Items in the correct order</label>' +
          '<div class="order-row"><span class="order-handle">1</span>Before touching a patient</div>' +
          '<div class="order-row"><span class="order-handle">2</span>Before a clean procedure</div>' +
          '<div class="order-row"><span class="order-handle">3</span>After body-fluid exposure</div>' +
          '<div class="order-row"><span class="order-handle">4</span>After touching a patient</div>' +
          '<div class="order-row"><span class="order-handle">5</span>After touching patient surroundings</div>',
        STAR:
          '<label for="max-stars">Maximum stars</label>' +
          '<input id="max-stars" type="text" value="5" />' +
          '<label for="star-correct" style="margin-top:10px">Correct rating</label>' +
          '<input id="star-correct" type="text" value="5" />'
      };

      const promptEl = document.getElementById('prompt');
      const bodyEl = document.getElementById('type-body');

      function selectType(type) {
        document.querySelectorAll('.type-chip').forEach((btn) => {
          btn.setAttribute('aria-pressed', btn.getAttribute('data-type') === type ? 'true' : 'false');
        });
        promptEl.value = prompts[type];
        bodyEl.innerHTML = bodies[type];
      }

      document.querySelectorAll('.type-chip').forEach((btn) => {
        btn.addEventListener('click', () => selectType(btn.getAttribute('data-type')));
      });

      selectType('RADIO');
    </script>
  </body>
</html>
