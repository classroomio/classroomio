<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insights Dashboard Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app-style scope switcher on top; widget grid beneath. The internal build also shows each widget's metric spec and data status. */
:root {
  --bg: #f5f6f9; --surface: #ffffff; --fg: #14171f; --muted: #5b6477; --line: #e2e5ec;
  --accent: #2447d6; --accent-soft: #e8edff; --good: #1b8a5a; --warn: #a96f12; --bad: #c4372e;
  --good-tint: #dff3e8; --warn-tint: #fbeccd; --bad-tint: #f9dad7;
  --font-body: 'Figtree', system-ui, sans-serif; --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1117; --surface: #171b23; --fg: #e8ebf2; --muted: #98a2b6; --line: #272d39;
  --accent: #8aa3ff; --accent-soft: #1e2850; --good: #4cc38a; --warn: #e0b04a; --bad: #f0766e;
  --good-tint: #163528; --warn-tint: #3a2e14; --bad-tint: #3d1d1b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1117; --surface: #171b23; --fg: #e8ebf2; --muted: #98a2b6; --line: #272d39;
  --accent: #8aa3ff; --accent-soft: #1e2850; --good: #4cc38a; --warn: #e0b04a; --bad: #f0766e;
  --good-tint: #163528; --warn-tint: #3a2e14; --bad-tint: #3d1d1b; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; padding-inline: 16px; }
.wrap { max-width: 1180px; margin-inline: auto; padding-block: 20px 56px; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 22px; font-weight: 700; text-wrap: balance; }
h2 { font-size: 14px; font-weight: 600; }
.sub { color: var(--muted); }
.example { background: var(--warn-tint); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { font: inherit; font-weight: 600; border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
:root[data-theme="dark"] .seg button[aria-pressed="true"], :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { color: #0e1117; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.live i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; }
.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
.head { display: flex; flex-direction: column; gap: 4px; }
#view { display: flex; flex-direction: column; gap: 18px; }
#top > * + * { margin-top: 12px; }
.keyrow { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.w { grid-column: span 12; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (min-width: 860px) { .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } }
.wh { display: flex; flex-direction: column; gap: 6px; }
.wt { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.tags { display: inline-flex; gap: 8px; align-items: center; }
.viz { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.badge.ok { background: var(--good-tint); color: var(--good); }
.badge.drv { background: var(--accent-soft); color: var(--accent); }
.badge.new { background: var(--warn-tint); color: var(--warn); }
.src { font-family: var(--font-mono); font-size: 11.5px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; align-self: flex-start; overflow-wrap: anywhere; }
body.hide-src .src { display: none; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.kpi .n { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .l { color: var(--muted); font-size: 13px; }
.kpi .d { font-size: 12px; font-variant-numeric: tabular-nums; }
.up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }
.kpi .badge { margin-top: 4px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--muted); }
td.c, th.c { text-align: center; }
.cell { display: inline-block; min-width: 44px; padding: 3px 8px; border-radius: 6px; text-align: center; font-weight: 600; }
.hi { background: var(--good-tint); } .mid { background: var(--warn-tint); } .lo { background: var(--bad-tint); } .na { color: var(--muted); font-weight: 400; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
.pill.ok { background: var(--good-tint); color: var(--good); } .pill.lag { background: var(--warn-tint); color: var(--warn); }
.pill.risk { background: var(--bad-tint); color: var(--bad); } .pill.done { background: var(--accent-soft); color: var(--accent); }
.hbar { display: grid; grid-template-columns: minmax(90px, 170px) 1fr 52px; gap: 10px; align-items: center; font-size: 13px; }
.hbar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 5px; }
.fill.warn { background: var(--warn); } .fill.bad { background: var(--bad); } .fill.good { background: var(--good); }
.hbar .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 9px; }
.cols { display: flex; align-items: flex-end; gap: 8px; height: 150px; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; }
.col .b { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.col .t { font-size: 11px; color: var(--muted); white-space: nowrap; }
.col .k { font-size: 12px; font-variant-numeric: tabular-nums; }
svg text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; }
svg .g { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.note { font-size: 12px; color: var(--muted); }
.gap { border: 1.5px dashed var(--warn); background: var(--warn-tint); border-radius: 10px; padding: 12px 14px; font-size: 13px; }
.reuse td:first-child { font-weight: 600; white-space: normal; min-width: 150px; }
.reuse td { white-space: normal; vertical-align: top; min-width: 150px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools input, .tools select, .picker select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; max-width: 100%; }
.tools input { flex: 1 1 220px; min-width: 0; }
.picker { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; }
.picker select { background: var(--surface); }
.mxfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 600; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
.btn:disabled { color: var(--muted); background: var(--line); cursor: default; }
.btn.sm { padding: 3px 10px; font-size: 12px; }
.empty { text-align: center; color: var(--muted); padding: 24px; }
.pick { cursor: pointer; }
.pick:hover td, .pick.sel td { background: var(--accent-soft); }
.mini { display: grid; grid-template-columns: 56px 34px; gap: 8px; align-items: center; }
.mini .track { height: 6px; }
.cc { display: flex; gap: 10px; align-items: center; }
.plan { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
th small { display: block; font-weight: 400; }
</style>

</head>
<body>
<div class="wrap">
  <div class="head" id="top"></div>
  <div class="bar">
    <div class="seg" role="group" aria-label="Scope">
      <button id="b-cohort" aria-pressed="true" data-scope="cohort">Cohort</button>
      <button id="b-course" aria-pressed="false" data-scope="course">Course</button>
      <button id="b-org" aria-pressed="false" data-scope="org">Organization</button>
    </div>
    <label class="toggle" id="srctoggle"><input type="checkbox" id="showsrc" checked> Show metric specs</label>
  </div>

  <div class="chips" id="scopechips"></div>
  <div id="view"></div>
</div>

<script>
const CUSTOMER = false;
const $ = (s) => document.querySelector(s);
const note = (dev, customer) => (CUSTOMER ? customer : dev);
const heat = (v) => (v == null ? 'na' : v >= 70 ? 'hi' : v >= 50 ? 'mid' : 'lo');
const cell = (v) => `<span class="cell ${heat(v)}">${v == null ? '–' : v + '%'}</span>`;
const passCell = (v, mark) => (v == null ? '<span class="cell na">–</span>' : `<span class="cell ${v >= mark ? 'hi' : 'lo'}">${v}%</span>`);
const pill = (s) => ({ ok: ['ok', 'On track'], lag: ['lag', 'Lagging'], risk: ['risk', 'At risk'], done: ['done', 'Completed'] })[s];
const BADGE = { ok: 'Data available', drv: 'Derived', new: 'Needs work' };
const badge = (a) => `<span class="badge ${a}">${BADGE[a]}</span>`;
const taken = (vals) => vals.filter((v) => v != null);
const mean = (xs) => (xs.length ? Math.round(xs.reduce((a, b) => a + b, 0) / xs.length) : 0);
const pct = (part, whole) => (whole ? Math.round((part / whole) * 100) : 0);

const widget = (cls, title, viz, src, body, noteText, avail = 'ok') => `
  <section class="w ${cls}">
    <div class="wh"><div class="wt"><h2>${title}</h2>${CUSTOMER ? '' : `<span class="tags">${badge(avail)}<span class="viz">${viz}</span></span>`}</div>${CUSTOMER ? '' : `<code class="src">${src}</code>`}</div>
    ${body}${noteText ? `<p class="note">${noteText}</p>` : ''}
  </section>`;

const kpis = (items) => `<div class="kpis">${items.map((k) => `
  <div class="kpi"><span class="l">${k.l}</span><span class="n">${k.n}</span>
  <span class="d ${k.t}">${k.d}</span>${CUSTOMER ? '' : `${badge(k.a || 'drv')}<code class="src">${k.src}</code>`}</div>`).join('')}</div>`;

const hbars = (rows, max = 100, unit = '%') => `<div class="stack">${rows.map((r) => `
  <div class="hbar"><span class="lab" title="${r.l}">${r.l}</span>
  <div class="track"><div class="fill ${r.c || ''}" style="width:${Math.min(100, (r.v / max) * 100)}%"></div></div>
  <span class="v">${r.v.toLocaleString()}${unit}</span></div>`).join('')}</div>`;

const columns = (rows) => {
  const max = Math.max(...rows.map((r) => r.v), 1);
  return `<div class="cols">${rows.map((r) => `<div class="col"><span class="k">${r.v}</span>
  <div class="b" style="height:${(r.v / max) * 100}%"></div><span class="t">${r.l}</span></div>`).join('')}</div>`;
};

const legend = (items) => `<div class="legend">${items.map((i) => `<span><i style="background:${i.c}"></i>${i.l}</span>`).join('')}</div>`;

function lineChart({ labels, series, band, yMax = 100, yTicks = [0, 25, 50, 75, 100], fmt = (v) => v + '%' }) {
  const W = 640, H = 250, L = 40, R = 34, T = 12, B = 40;
  const x = (i) => L + (i * (W - L - R)) / Math.max(labels.length - 1, 1);
  const y = (v) => T + (1 - v / yMax) * (H - T - B);
  const grid = yTicks.map((t) => `<line class="g" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`).join('');
  const xl = labels.map((l, i) => `<text x="${x(i)}" y="${H - 14}" text-anchor="middle">${l}</text>`).join('');
  let bandEl = '';
  if (band) {
    const pts = band.map((b, i) => (b ? [i, b] : null)).filter(Boolean);
    const up = pts.map(([i, b]) => `${x(i)},${y(b[1])}`).join(' ');
    const dn = pts.slice().reverse().map(([i, b]) => `${x(i)},${y(b[0])}`).join(' ');
    bandEl = `<polygon points="${up} ${dn}" fill="var(--accent)" fill-opacity=".14"/>`;
  }
  const lines = series.map((s) => {
    const pts = s.values.map((v, i) => (v == null ? null : [x(i), y(v)])).filter(Boolean);
    if (!pts.length) return '';
    const path = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]},${p[1]}`).join(' ');
    const dots = pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${s.color}"/>`).join('');
    const last = pts[pts.length - 1];
    const lv = s.values.filter((v) => v != null).pop();
    return `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.5" ${s.dash ? 'stroke-dasharray="6 5"' : ''} stroke-linejoin="round"/>${dots}<text x="${last[0]}" y="${last[1] - 9}" text-anchor="middle" style="fill:${s.color};font-weight:600">${fmt(lv)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Line chart">${grid}${xl}${bandEl}${lines}</svg>`;
}

function sparkline(vals) {
  const t = taken(vals);
  if (t.length < 2) return '<span class="na">–</span>';
  const W = 92, H = 28, P = 4;
  const x = (i) => P + (i * (W - 2 * P)) / (vals.length - 1);
  const y = (v) => P + (1 - v / 100) * (H - 2 * P);
  const pts = vals.map((v, i) => (v == null ? null : [x(i), y(v)])).filter(Boolean);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]},${p[1]}`).join(' ');
  const end = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Score trend"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="${end[0]}" cy="${end[1]}" r="3" fill="var(--accent)"/></svg>`;
}

/* ---------- Courses in the cohort. Exercises are columns, in section then exercise order. ---------- */
const COURSES = [
  { title: 'Individual Tax Fundamentals', passMark: 70,
    exercises: ['Filing basics', 'Filing status', 'Income types', 'Deductions', 'Credits', 'Schedule C', 'Final exam'],
    sections: [{ title: 'Intake and filing status', ex: [0, 1] }, { title: 'Income types', ex: [2] }, { title: 'Deductions', ex: [3] }, { title: 'Credits', ex: [4] }, { title: 'Schedule C', ex: [5] }, { title: 'Review cases', ex: [6] }],
    questions: [['Which form reports self-employment income?', 'Credits', 41, '1099-K instead of 1099-NEC'], ['Standard deduction, married filing jointly', 'Deductions', 49, 'Single filer amount'], ['Child tax credit income phase-out', 'Credits', 53, 'Skipped the phase-out step'], ['Home office deduction eligibility', 'Schedule C', 58, 'Counted a shared room'], ['Filing status for a widowed parent', 'Filing status', 66, 'Head of household']] },
  { title: 'Client Communication', passMark: 70,
    exercises: ['Active listening', 'Difficult conversations', 'Final exam'],
    sections: [{ title: 'Listening', ex: [0] }, { title: 'Difficult conversations', ex: [1] }, { title: 'Wrap-up', ex: [2] }],
    questions: [['Best response to an upset client', 'Difficult conversations', 52, 'Offered a discount first'], ['Which is active listening?', 'Active listening', 71, 'Interrupting to confirm'], ['When to escalate a complaint', 'Difficult conversations', 60, 'Waited for a second complaint']] },
  { title: 'Data Security Basics', passMark: 80,
    exercises: ['Phishing', 'Passwords', 'Final exam'],
    sections: [{ title: 'Phishing', ex: [0] }, { title: 'Passwords', ex: [1] }, { title: 'Wrap-up', ex: [2] }],
    questions: [['Spotting a phishing sender', 'Phishing', 62, 'Trusted the display name'], ['Strongest password choice', 'Passwords', 70, 'Long but reused'], ['Where to report a suspicious email', 'Phishing', 80, 'Replied to the sender']] }
];

/* ---------- One generated roster feeds every cohort number ---------- */
function mulberry(seedValue) {
  let a = seedValue;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const SEED = [
  ['Rhea Kapoor', [22, 31, 35, 40, null, null, null], 3],
  ['Dev Malhotra', [34, 29, 41, null, null, null, null], 2],
  ['Sana Qureshi', [41, 44, 52, 58, 55, null, null], 0],
  ['Imran Shaikh', [52, 48, 60, 62, 63, null, null], 0],
  ['Meera Nair', [64, 71, 74, 78, 81, 84, null], 0],
  ['Kabir Joshi', [58, 66, 69, 73, 79, 80, null], 1],
  ['Tara Bose', [71, 80, 83, 86, 90, 92, 91], 1],
  ['Nikhil Rao', [49, 63, 70, 74, 77, 82, 85], 0]
];
const FIRST = ['Aanya', 'Vikram', 'Isha', 'Arjun', 'Zoya', 'Rohan', 'Pooja', 'Karan', 'Anika', 'Samir', 'Neha', 'Yash', 'Divya', 'Aditya', 'Farah', 'Manav', 'Leela', 'Omar', 'Priya', 'Tejas', 'Mira', 'Sahil', 'Ananya', 'Rahul'];
const LAST = ['Iyer', 'Khanna', 'Verma', 'Sethi', 'Desai', 'Menon', 'Gill', 'Patel', 'Reddy', 'Banerjee', 'Chopra', 'Sinha', 'Bhatt', 'Kulkarni', 'Mishra', 'Thomas', 'Dutta', 'Saxena', 'Pillai', 'Ahuja'];

function buildRoster() {
  const rnd = mulberry(7);
  const clamp = (v) => Math.max(5, Math.min(98, Math.round(v)));
  const pickFrom = (list) => list[Math.floor(rnd() * list.length)];
  const make = (id, name, taxVals, days, finisher) => {
    const ability = mean(taken(taxVals));
    const record = (n, vals) => {
      const count = taken(vals).length;
      return { n, vals, count, progress: count === n ? 100 : Math.min(97, Math.round((count / n) * 92 + rnd() * 6)) };
    };
    const c = [record(7, taxVals)];
    [3, 3].forEach((n) => {
      const count = finisher ? n : Math.floor(rnd() * n);
      c.push(record(n, Array.from({ length: n }, (_, j) => (j < count ? clamp(ability + rnd() * 20 - 10) : null))));
    });
    const avg = mean(c.flatMap((x) => taken(x.vals)));
    const status = finisher ? 'done' : days >= 2 || avg < 50 ? 'risk' : avg < 65 || c[0].count < 5 ? 'lag' : 'ok';
    const base = status === 'risk' ? 40 + rnd() * 35 : 60 + rnd() * 40;
    const vidDays = Array.from({ length: 6 }, (_, d) => clamp((d === 5 ? 0.7 : 1) * (base + rnd() * 16 - 8)));
    const clsDays = Array.from({ length: 6 }, () => (rnd() < (status === 'risk' ? 0.72 : 0.94) ? 100 : 0));
    const finalsPass = c.every((x, i) => x.vals[x.n - 1] != null && x.vals[x.n - 1] >= COURSES[i].passMark);
    return {
      id, name, c, days, status, avg, progress: mean(c.map((x) => x.progress)),
      vidDays, clsDays, vid: mean(vidDays), cls: mean(clsDays),
      overdue: !finisher && (days >= 2 ? rnd() < 0.6 : rnd() < 0.05), overdueCourse: Math.floor(rnd() * 3),
      cert: finisher && finalsPass
    };
  };
  const rows = SEED.map((s, i) => make(i, s[0], s[1], s[2], s[1][6] != null));
  const seen = new Set(rows.map((l) => l.name));
  while (rows.length < 248) {
    const name = pickFrom(FIRST) + ' ' + pickFrom(LAST);
    if (seen.has(name)) continue;
    seen.add(name);
    const base = clamp(50 + rnd() * 30);
    const gain = rnd() * 8 - 1;
    const finisher = rnd() < 0.12;
    const count = finisher ? 7 : 3 + Math.floor(rnd() * 4);
    const vals = Array.from({ length: 7 }, (_, j) => (j < count ? clamp(base + gain * j + (rnd() * 10 - 5)) : null));
    const days = rnd() < 0.72 ? 0 : rnd() < 0.5 ? 1 : 2 + Math.floor(rnd() * 4);
    rows.push(make(rows.length, name, vals, days, finisher));
  }
  return rows;
}
const ROSTER = buildRoster();
const lastLabel = (d) => (d === 0 ? 'Today' : d === 1 ? 'Yesterday' : d + ' days ago');
const ORDER = { risk: 0, lag: 1, ok: 2, done: 3 };

let picked = 0;
const mx = { q: '', status: '', active: '', score: '', flag: '', sort: 'status', limit: 10, course: 'all' };
const inAll = () => mx.course === 'all';
const progressOf = (l) => (inAll() ? l.progress : l.c[mx.course].progress);
const scoreOf = (l) => (inAll() ? l.avg : mean(taken(l.c[mx.course].vals)));
const nowAt = (l, ci) => {
  const rec = l.c[ci];
  if (rec.progress === 100) return 'Finished';
  const sections = COURSES[ci].sections;
  return sections[Math.min(sections.length - 1, Math.floor((rec.progress / 100) * sections.length))].title;
};

function courseStats(ci) {
  const course = COURSES[ci];
  const n = ROSTER.length;
  const journey = course.exercises.map((_, j) => {
    const scores = ROSTER.map((l) => l.c[ci].vals[j]).filter((v) => v != null).sort((a, b) => a - b);
    return scores.length >= n * 0.25 ? { avg: mean(scores), band: [scores[Math.floor(0.25 * (scores.length - 1))], scores[Math.floor(0.75 * (scores.length - 1))]] } : null;
  });
  const sections = course.sections.map((section, si) => {
    const lastEx = section.ex[section.ex.length - 1];
    const took = ROSTER.filter((l) => l.c[ci].vals[lastEx] != null);
    const scores = took.flatMap((l) => section.ex.map((e) => l.c[ci].vals[e]).filter((v) => v != null));
    return {
      title: section.title, si, took: took.length, avg: took.length ? mean(scores) : null,
      pass: took.length ? pct(took.filter((l) => l.c[ci].vals[lastEx] >= course.passMark).length, took.length) : null,
      vid: mean(ROSTER.map((l) => l.vidDays[si])), cls: mean(ROSTER.map((l) => l.clsDays[si]))
    };
  });
  const last = course.exercises.length - 1;
  const finalTook = ROSTER.filter((l) => l.c[ci].vals[last] != null);
  return {
    journey, sections,
    avgProgress: mean(ROSTER.map((l) => l.c[ci].progress)),
    avgScore: mean(ROSTER.map((l) => mean(taken(l.c[ci].vals))).filter((v) => v > 0)),
    completed: ROSTER.filter((l) => l.c[ci].progress === 100).length,
    finalTook: finalTook.length, finalPass: pct(finalTook.filter((l) => l.c[ci].vals[last] >= course.passMark).length, finalTook.length)
  };
}

function selectionStats() {
  const R = ROSTER;
  const progs = R.map(progressOf);
  const scores = R.map(scoreOf).filter((v) => v > 0);
  const overdue = inAll() ? R.filter((l) => l.overdue) : R.filter((l) => l.overdue && l.overdueCourse === mx.course);
  return {
    n: R.length, activeToday: R.filter((l) => l.days === 0).length,
    avgProgress: mean(progs), avgScore: mean(scores),
    completed: inAll() ? R.filter((l) => l.status === 'done').length : R.filter((l) => l.c[mx.course].progress === 100).length,
    cert: R.filter((l) => l.cert).length,
    overdue,
    progressBuckets: [progs.filter((p) => p < 25).length, progs.filter((p) => p >= 25 && p < 50).length, progs.filter((p) => p >= 50 && p < 75).length, progs.filter((p) => p >= 75 && p < 100).length, progs.filter((p) => p === 100).length],
    inactive: R.filter((l) => l.days >= 2).length,
    low: R.filter((l) => scoreOf(l) > 0 && scoreOf(l) < 50).length,
    lowVideo: R.filter((l) => l.vid < 60).length
  };
}

/* ---------- Learner detail, list, filters ---------- */

    lineChart({ labels: course.exercises, series: [{ values: rec.vals, color: 'var(--accent)' }, { values: journey.map((j) => (j ? j.avg : null)), color: 'var(--muted)', dash: true }] }) +

const matrixHead = () => {

    return `<tr><th>Learner</th><th>Progress</th><th class="c">Average score</th><th class="c">Courses completed</th><th class="c">Video</th><th class="c">Classroom</th><th class="c">Certificate</th><th>Last login</th><th>Status</th></tr>`;

};

const rowHtml = (l) => {
  const tail = `<td class="c">${l.vid}%</td><td class="c">${l.cls}%</td><td class="c">${l.cert ? '<span class="pill done">Issued</span>' : '<span class="na">–</span>'}</td><td>${lastLabel(l.days)}</td><td><span class="pill ${pill(l.status)[0]}">${pill(l.status)[1]}</span>${l.overdue ? ' <span class="pill risk">Overdue</span>' : ''}</td>`;
  const name = `<td><b>${l.name}</b></td>`;
  if (inAll()) {
    const done = l.c.filter((rec) => rec.progress === 100).length;
    return `<tr class="pick ${l.id === picked ? 'sel' : ''}" data-learner="${l.id}">${name}<td><div class="mini"><div class="track"><div class="fill" style="width:${l.progress}%"></div></div><span>${l.progress}%</span></div></td><td class="c">${cell(l.avg)}</td><td class="c">${done} of ${COURSES.length}</td>${tail}</tr>`;
  }
  const rec = l.c[mx.course];
  const course = COURSES[mx.course];
  const last = course.exercises.length - 1;
  const scores = rec.vals.map((v, j) => `<td class="c">${j === last ? passCell(v, course.passMark) : cell(v)}</td>`).join('');
  return `<tr class="pick ${l.id === picked ? 'sel' : ''}" data-learner="${l.id}">${name}<td><div class="mini"><div class="track"><div class="fill" style="width:${rec.progress}%"></div></div><span>${rec.progress}%</span></div></td><td>${nowAt(l, mx.course)}</td>${scores}<td>${sparkline(rec.vals)}</td>${tail}</tr>`;
};

function visibleRows() {
  const q = mx.q.trim().toLowerCase();
  const rows = ROSTER.filter((l) => {
    const s = scoreOf(l);
    if (q && !l.name.toLowerCase().includes(q)) return false;
    if (mx.status && l.status !== mx.status) return false;
    if (mx.active === 'today' && l.days !== 0) return false;
    if (mx.active === 'idle' && l.days < 2) return false;
    if (mx.score === 'lt50' && !(s < 50)) return false;
    if (mx.score === 'mid' && !(s >= 50 && s < 70)) return false;
    if (mx.score === 'gte70' && !(s >= 70)) return false;
    if (mx.flag === 'overdue' && !l.overdue) return false;
    if (mx.flag === 'cert' && !l.cert) return false;
    if (mx.flag === 'nocert' && l.cert) return false;
    return true;
  });
  const order = {
    status: (a, b) => ORDER[a.status] - ORDER[b.status] || scoreOf(a) - scoreOf(b),
    name: (a, b) => a.name.localeCompare(b.name),
    progress: (a, b) => progressOf(a) - progressOf(b),
    low: (a, b) => scoreOf(a) - scoreOf(b)
  };
  return rows.sort(order[mx.sort]);
}

function drawMatrix() {
  const rows = visibleRows();
  const shown = rows.slice(0, mx.limit);
  $('#mx-head').innerHTML = matrixHead();
  $('#mx-body').innerHTML = shown.length ? shown.map(rowHtml).join('') : '<tr><td colspan="20" class="empty">No learners match these filters.</td></tr>';
  $('#mx-count').textContent = `Showing ${shown.length} of ${rows.length} matching · ${ROSTER.length} learners in cohort`;
  $('#mx-more').hidden = shown.length >= rows.length;
  $('#mx-msg').textContent = '';
  $('#mx-export').onclick = () => { $('#mx-msg').textContent = `Export would download ${rows.length} rows as CSV, with the current filters and sort applied.`; };
  $('#mx-body').querySelectorAll('[data-learner]').forEach((row) => row.addEventListener('click', () => {
    picked = Number(row.dataset.learner);
    $('#detail').outerHTML = inAll() ? learnerCourses(ROSTER[picked]) : learnerDetail(ROSTER[picked], mx.course, courseStats(mx.course).journey);
    drawMatrix();
    const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    $('#detail').scrollIntoView({ block: 'center', behavior: calm ? 'auto' : 'smooth' });
  }));
}

function initCohort() {
  $('#course-pick').value = String(mx.course);
  $('#course-pick').addEventListener('change', (e) => {
    mx.course = e.target.value === 'all' ? 'all' : Number(e.target.value);
    mx.limit = 10;
    mx.sort = mx.sort === 'progress' || mx.sort === 'low' || mx.sort === 'name' ? mx.sort : 'status';
    render();
  });
  [['#q', 'q'], ['#f-status', 'status'], ['#f-active', 'active'], ['#f-score', 'score'], ['#f-flag', 'flag'], ['#f-sort', 'sort']].forEach(([sel, key]) => {
    const el = $(sel);
    el.value = mx[key];
    el.addEventListener('input', () => { mx[key] = el.value; mx.limit = 10; drawMatrix(); });
  });
  $('#mx-more').addEventListener('click', () => { mx.limit += 10; drawMatrix(); });
  drawMatrix();
  const remindAll = $('#remind-all');
  if (remindAll) remindAll.onclick = () => { remindAll.disabled = true; remindAll.textContent = 'Reminders queued'; document.querySelectorAll('.remind').forEach((b) => { b.disabled = true; b.textContent = 'Queued'; }); };
  document.querySelectorAll('.remind').forEach((b) => { b.onclick = () => { b.disabled = true; b.textContent = 'Queued'; }; });
}

      { l: 'Enrolled', n: '1,180', d: '+212 this week', t: 'up', a: 'ok', src: 'groupmember · learner · count' },
      { l: 'Completion rate', n: '41%', d: '+4 pts vs last week', t: 'up', src: 'learner_course · status=completed · rate' },
      { l: 'Average grade', n: '67%', d: 'across exercises taken', t: 'flat', src: 'submission · score_pct · avg' },
      { l: 'Final exam pass rate', n: '79%', d: 'of 484 who took it, pass mark 70%', t: 'flat', src: 'submission · score_pct ≥ course.certificate.exerciseMinScorePercent · rate' },
      { l: 'Median days to finish', n: '8', d: 'enrolment to completion', t: 'flat', src: 'completed_at − enrolled_at · median' }
    ])}
    <div class="grid">
      ${widget('s7', 'Scores by exercise, one line per cohort', 'multi-line', 'submission · score_pct · avg · dimensions: exercise, cohort', lineChart({ labels: ex, series: [{ values: [52, 57, 61, 64, 68, 70, 74], color: 'var(--accent)' }, { values: [49, 55, 58, 63, 66, 69, null], color: 'var(--good)' }, { values: [44, 47, 52, 55, null, null, null], color: 'var(--warn)', dash: true }] }) + legend([{ c: 'var(--accent)', l: 'Cohort 7' }, { c: 'var(--good)', l: 'Cohort 6' }, { c: 'var(--warn)', l: 'Cohort 8 (in progress)' }]), null, 'drv')}
      ${widget('s5', 'Score distribution, final exam', 'histogram', 'submission · score_pct · count · bucket: 10 · exercise = course certificate required exercise', columns([{ l: '<50', v: 38 }, { l: '50s', v: 61 }, { l: '60s', v: 112 }, { l: '70s', v: 148 }, { l: '80s', v: 91 }, { l: '90+', v: 34 }]), null, 'drv')}
      ${widget('s6', 'Lesson completion drop-off', 'horizontal bar', 'lesson_completion · rate · dimension: lesson', hbars([{ l: 'Intake and filing status', v: 96 }, { l: 'Income types', v: 91 }, { l: 'Deductions', v: 84 }, { l: 'Credits', v: 71, c: 'warn' }, { l: 'Schedule C', v: 58, c: 'warn' }, { l: 'Review cases', v: 44, c: 'bad' }]), 'The steepest fall is between Credits and Schedule C.', 'ok')}
      ${widget('s6', 'Hardest exercises', 'table', 'submission · score_pct · avg · attempts · dimension: exercise · sort: asc', `
        <div class="scroll"><table><thead><tr><th>Exercise</th><th class="c">Avg score</th><th class="c">Pass rate</th><th class="c">Avg attempts</th></tr></thead><tbody>
        <tr><td>Schedule C</td><td class="c">${cell(51)}</td><td class="c">${cell(48)}</td><td class="c">2.3</td></tr>
        <tr><td>Credits</td><td class="c">${cell(58)}</td><td class="c">${cell(62)}</td><td class="c">1.9</td></tr>
        <tr><td>Deductions</td><td class="c">${cell(66)}</td><td class="c">${cell(74)}</td><td class="c">1.4</td></tr>
        <tr><td>Filing basics</td><td class="c">${cell(78)}</td><td class="c">${cell(93)}</td><td class="c">1.1</td></tr>
        </tbody></table></div>`, null, 'drv')}
      ${questionsWidget('s12', COURSES[0].questions)}
      ${widget('s12', 'Cohorts taking this course', 'table', 'lesson_completion + submission · dimension: cohort', `
        <div class="scroll"><table><thead><tr><th>Cohort</th><th class="c">Learners</th><th class="c">Progress</th><th class="c">Avg score</th><th class="c">Final exam pass rate</th><th class="c">Overdue</th></tr></thead><tbody>
        <tr><td>Cohort 8</td><td class="c">212</td><td class="c">${cell(22)}</td><td class="c">${cell(47)}</td><td class="c">${cell(null)}</td><td class="c">3</td></tr>
        <tr><td>Cohort 7</td><td class="c">${ROSTER.length}</td><td class="c">${cell(courseStats(0).avgProgress)}</td><td class="c">${cell(courseStats(0).avgScore)}</td><td class="c">${courseStats(0).finalTook ? passCell(courseStats(0).finalPass, 70) : cell(null)}</td><td class="c">${ROSTER.filter((l) => l.overdue && l.overdueCourse === 0).length}</td></tr>
        <tr><td>Cohort 6</td><td class="c">240</td><td class="c">${cell(93)}</td><td class="c">${cell(74)}</td><td class="c">${cell(81)}</td><td class="c">2</td></tr>
        <tr><td>Cohort 5</td><td class="c">236</td><td class="c">${cell(100)}</td><td class="c">${cell(72)}</td><td class="c">${cell(78)}</td><td class="c">0</td></tr>
        </tbody></table></div>`, 'Showing 4 of 8 cohorts.', 'drv')}
    </div>
    ${CUSTOMER ? planned() : reuse()}`;
  },

  org() {
    $('#scopechips').innerHTML = `<span class="chip live"><i></i>Live · updated <b id="age">0s</b> ago</span><span class="chip"><b>${CUSTOMER ? 'Your organization' : 'Example Co'}</b></span><span class="chip">8 active cohorts</span><span class="chip">Seats: 2,046 of 5,000</span>`;
    const S = selectionStats();
    const cohorts = [
      ['Cohort 8', 'Mon 1 Dec', 212, 12, null, 3, 'ok'],
      ['Cohort 7', 'Mon 24 Nov', S.n, S.avgProgress, S.avgScore, ROSTER.filter((l) => l.overdue).length, 'lag'],
      ['Cohort 6', 'Mon 17 Nov', 240, 93, 74, 2, 'ok'],
      ['Cohort 5', 'Mon 10 Nov', 236, 100, 72, 0, 'done'],
      ['Cohort 4', 'Mon 3 Nov', 250, 100, 69, 0, 'done']
    ];
    return `
    ${kpis([
      { l: 'Logged in, last 7 days', n: '1,812', d: '89% of enrolled', t: 'flat', a: 'ok', src: 'analytics_login_events · learner · count' },
      { l: 'Average progress', n: '71%', d: '+6 pts this week', t: 'up', src: 'lesson_completion · progress_pct · avg' },
      { l: 'Completions', n: '726', d: '35% of enrolled', t: 'up', src: 'learner_course · status=completed · count' },
      { l: 'Certificates issued', n: '684', d: '94% of completions', t: 'flat', a: 'ok', src: 'course_certificate_issue · count' },
      { l: 'Needs attention', n: '97', d: 'inactive, low score or overdue', t: 'down', src: 'derived flags · count' }
    ])}
    <div class="grid">
      ${widget('s8', 'Cohorts at a glance', 'table + progress', 'lesson_completion + submission · dimension: cohort', `
        <div class="scroll"><table><thead><tr><th>Cohort</th><th>Created</th><th class="c">Learners</th><th style="min-width:150px">Progress</th><th class="c">Avg score</th><th class="c">Overdue</th><th>Health</th></tr></thead><tbody>
        ${cohorts.map((b) => `<tr><td><b>${b[0]}</b></td><td>${b[1]}</td><td class="c">${b[2]}</td><td><div class="hbar" style="grid-template-columns:1fr 38px"><div class="track"><div class="fill" style="width:${b[3]}%"></div></div><span class="v">${b[3]}%</span></div></td><td class="c">${cell(b[4])}</td><td class="c">${b[5]}</td><td><span class="pill ${pill(b[6])[0]}">${pill(b[6])[1]}</span></td></tr>`).join('')}
        </tbody></table></div>`, note('Showing 5 of 8 cohorts. A row opens that cohort\'s dashboard. Cohort 7 matches the cohort tab.', 'Showing 5 of 8 cohorts. Select a cohort to open its dashboard.'), 'drv')}
      ${widget('s4', 'Needs attention, by reason', 'horizontal bar', 'derived flags · count · dimension: reason', hbars([{ l: 'No login, 2+ days', v: 41, c: 'bad' }, { l: 'Score under 50%', v: 33, c: 'bad' }, { l: 'Overdue', v: 14, c: 'warn' }, { l: 'Video attendance under 60%', v: 9, c: 'warn' }], 50, ''), null, 'drv')}
      ${widget('s5', 'Final exam average, by cohort', 'horizontal bar', 'submission · score_pct · avg · dimension: cohort · exercise = course certificate required exercise', hbars([{ l: 'Cohort 4', v: 69 }, { l: 'Cohort 5', v: 72 }, { l: 'Cohort 6', v: 74 }]), 'Finished cohorts only.', 'drv')}
      ${widget('s7', 'Hiring ramp vs target', 'line', 'organizationmember · created_at · cumulative · dimension: week', lineChart({ labels: ['3 Nov', '10 Nov', '17 Nov', '24 Nov', '1 Dec', '8 Dec'], series: [{ values: [120, 480, 900, 1320, 1710, 2046], color: 'var(--accent)' }, { values: [2000, 2000, 2000, 2000, 2000, 2000], color: 'var(--muted)', dash: true }], yMax: 5000, yTicks: [0, 1000, 2000, 3000, 4000, 5000], fmt: (v) => v.toLocaleString() }) + legend([{ c: 'var(--accent)', l: 'Enrolled learners' }, { c: 'var(--muted)', l: 'First-wave target' }]), null, 'drv')}
      ${widget(CUSTOMER ? 's12' : 's6', 'Courses by completion', 'horizontal bar', 'learner_course · status=completed · rate · dimension: course', hbars([{ l: 'Individual Tax Fundamentals', v: 41 }, { l: 'Client Communication', v: 88 }, { l: 'Data Security Basics', v: 96 }]), null, 'drv')}
      ${CUSTOMER ? '' : widget('s6', 'Scheduled reports', 'planned', 'saved dashboard + schedule + recipients', `
        <div class="stack"><div class="hbar" style="grid-template-columns:1fr auto"><span>Executive summary · weekdays 08:00 · CEO</span><span class="badge new">Planned</span></div>
        <div class="hbar" style="grid-template-columns:1fr auto"><span>Cohort health digest · Mon 09:00 · Heads of L&amp;D</span><span class="badge new">Planned</span></div></div>`, 'Also needs a read-only way for the CEO to sign in. Today the roles are admin, tutor and student.', 'new')}
    </div>
    ${CUSTOMER ? planned() : reuse()}`;
  }
};

let scope = 'cohort';
let ageTimer = null;
function startClock() {
  clearInterval(ageTimer);
  let seconds = 0;
  ageTimer = setInterval(() => {
    seconds = (seconds + 1) % 30;
    const el = $('#age');
    if (el) el.textContent = seconds + 's';
  }, 1000);
}
function renderTop() {
  $('#top').innerHTML = CUSTOMER
    ? `<h1>Live learner analytics for every cohort</h1>
       <p class="sub">A preview of what we plan to build. Switch between a single cohort, a course, and your whole organization. Every number is sample data.</p>
       <div class="example">Sample data for illustration. Names and numbers are made up.</div>
       <div class="keyrow"><span>See where every learner is today</span><span>Follow scores across a course's exercises</span><span>Spot who needs help</span><span>Give leadership one live view</span></div>`
    : `<h1>Insights dashboard mock</h1>
       <p class="sub">One widget set, three scopes. Each widget shows its metric spec and whether the data exists in ClassroomIO today.</p>
       <div class="example">Example data only. Scenario: Example Co, seasonal hiring. Every cohort number on this page is computed from the same generated roster of 248 learners.</div>
       <div class="keyrow"><span><span class="badge ok">Data available</span> already stored</span><span><span class="badge drv">Derived</span> computed from stored data</span><span><span class="badge new">Needs work</span> a feature still to build</span><span>Widgets whose data is not collected yet are left out. See the PRD, Blocked Sections.</span></div>`;
  if (CUSTOMER) $('#srctoggle').remove();
}
function render() {
  $('#view').innerHTML = views[scope]();
  if (scope === 'cohort') initCohort();
  startClock();
  document.querySelectorAll('[data-scope]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.scope === scope)));
}
document.querySelectorAll('[data-scope]').forEach((b) => b.addEventListener('click', () => { scope = b.dataset.scope; render(); }));
if (!CUSTOMER) $('#showsrc').addEventListener('change', (e) => document.body.classList.toggle('hide-src', !e.target.checked));
renderTop();
render();
</script>
</body>
</html>
