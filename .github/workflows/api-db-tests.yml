name: API database tests

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/db/**'
      - 'packages/core/**'
      - 'packages/utils/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api-db-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/db/**'
      - 'packages/core/**'
      - 'packages/utils/**'

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classroomio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classroomio_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classroomio_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API and its workspace dependencies
        run: pnpm --filter @cio/api^... build && pnpm --filter @cio/api build

      - name: Migrate the test database
        run: pnpm --filter @cio/db db:migrate

      - name: Run database integration tests
        run: pnpm --filter @cio/api test:db
