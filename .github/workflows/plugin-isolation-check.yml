name: Plugin artifacts verification

on:
  pull_request:
    paths:
      - 'packages/plugin-sdk/**'
      - 'packages/plugin-design/**'
      - 'packages/certificate-kit/**'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'packages/plugin-sdk/**'
      - 'packages/plugin-design/**'
      - 'packages/certificate-kit/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/classroomio-plugins
          path: classroomio-plugins
          token: ${{ secrets.PLUGIN_REPOSITORY_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @classroomio/plugin-sdk build
      - run: pnpm install --frozen-lockfile
        working-directory: classroomio-plugins
      - run: node ../packages/plugin-sdk/bin/cio-plugin.mjs build --all
        working-directory: classroomio-plugins
      - run: node ../packages/plugin-sdk/bin/cio-plugin.mjs verify
        working-directory: classroomio-plugins
      - uses: actions/upload-artifact@v4
        with:
          name: official-plugin-artifacts
          path: classroomio-plugins/.plugin-artifacts/
          if-no-files-found: error
          retention-days: 7
