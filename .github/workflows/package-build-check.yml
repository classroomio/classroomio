name: Package build check

on:
  pull_request:
    paths:
      - 'apps/dashboard/**'
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.nvmrc'
      - '.github/workflows/package-build-check.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/dashboard/**'
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.nvmrc'
      - '.github/workflows/package-build-check.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Three utils test files reach `@cio/utils/constants`, a self-referencing
      # import that resolves through dist, so the package must be built first.
      - name: Build and test utils
        run: pnpm --filter @cio/utils build && pnpm --filter @cio/utils test

      - name: Prepare dashboard env
        run: cp apps/dashboard/.env.example apps/dashboard/.env

      - name: Run dashboard tests
        run: pnpm --filter @cio/dashboard test

      - name: Build dashboard
        run: pnpm --filter @cio/dashboard^... build && pnpm --filter @cio/dashboard build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Build API
        run: pnpm --filter @cio/api^... build && pnpm --filter @cio/api build

      - name: Run API tests
        run: pnpm --filter @cio/api exec vitest run
