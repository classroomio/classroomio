name: Weekly Patch Release

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Work out the next patch version
        id: version
        run: |
          last_tag=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          IFS=. read -r major minor patch <<< "${last_tag#v}"
          echo "last=${last_tag}" >> "$GITHUB_OUTPUT"
          echo "next=v${major}.${minor}.$((patch + 1))" >> "$GITHUB_OUTPUT"
          echo "commits=$(git rev-list --count "${last_tag}..HEAD")" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        id: create
        if: steps.version.outputs.commits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.version.outputs.next }}
          LAST_TAG: ${{ steps.version.outputs.last }}
        run: |
          gh release create "$NEXT_TAG" \
            --target "$(git rev-parse HEAD)" \
            --generate-notes \
            --notes-start-tag "$LAST_TAG"
          echo "tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"

  publish-images:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Tags created with GITHUB_TOKEN do not fire `push` workflows; workflow_dispatch is the documented exception.
      - name: Publish Docker images for the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh workflow run docker-publish.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
