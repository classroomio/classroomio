<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activity player</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
      }
      #status {
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
        border-bottom: 1px solid #ccc;
      }
      #stage {
        position: relative;
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #package-frame {
        flex: 1;
        width: 100%;
        border: 0;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1.5rem;
        background: #fff;
        pointer-events: none;
      }
      #loading[hidden] {
        display: none;
      }
      .loading-card {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .sk {
        border-radius: 0.5rem;
        background: linear-gradient(90deg, #e8e8e8 25%, #f4f4f4 50%, #e8e8e8 75%);
        background-size: 200% 100%;
        animation: loading-shimmer 1.4s infinite;
      }
      .sk-title {
        height: 1.5rem;
        width: 38%;
      }
      .sk-hero {
        aspect-ratio: 16 / 9;
        width: 100%;
      }
      .sk-line {
        height: 0.85rem;
        width: 100%;
      }
      .sk-line.short {
        width: 64%;
      }
      .loading-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        color: #555;
        font-size: 0.9rem;
      }
      .spinner {
        width: 1rem;
        height: 1rem;
        border-radius: 50%;
        border: 2px solid #ccc;
        border-top-color: #555;
        animation: loading-spin 0.8s linear infinite;
      }
      @keyframes loading-shimmer {
        to {
          background-position: -200% 0;
        }
      }
      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk,
        .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="status" role="status">Loading…</div>
    <div id="stage">
      <iframe
        id="package-frame"
        title="Package content"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
      ></iframe>
      <div id="loading" role="status">
        <div class="loading-card" aria-hidden="true">
          <div class="sk sk-title"></div>
          <div class="sk sk-hero"></div>
          <div class="sk sk-line"></div>
          <div class="sk sk-line short"></div>
        </div>
        <div class="loading-row"><span class="spinner"></span><span>Loading package…</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
