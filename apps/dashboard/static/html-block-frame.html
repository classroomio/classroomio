<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <script>
      window.addEventListener('message', function (event) {
        if (event.source !== window.parent || !event.data || event.data.type !== 'cio-html-block:render') return;

        document.open();
        document.write(String(event.data.html));
        document.close();
      });
      window.parent.postMessage({ type: 'cio-html-block:ready' }, '*');
    </script>
  </body>
</html>
